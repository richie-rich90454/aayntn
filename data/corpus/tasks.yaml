# The task corpus.
#
# One entry per problem in data/problems. `techniques` names ids from
# data/taxonomy.yaml and nowhere else. `evidence` records how the tags were
# checked: an official editorial URL, or the literal `derived` when the tags
# come from our own reading of the statement.
#
# Add a tag with:
#   pnpm exec tsx tools/coverage/tag.ts <task-id> <technique-id> <evidence>
#
# The file is rewritten in id order with each technique list sorted, so a tag
# produces one clean diff line.

