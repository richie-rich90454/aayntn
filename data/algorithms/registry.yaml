# The algorithm registry.
#
# The canonical metadata for every algorithm lives in the manifest beside its
# source, in implementations/<domain>/<algorithm>/algorithm.yaml. This file is
# the index of those manifests, so that a reader can see the whole set at a
# glance and so that a tool can find a manifest by identifier.
#
# The build checks that every entry here names a manifest that exists, and that
# every manifest is listed.

algorithms:
    - id: searching.binary-search
      title: Binary search
      subject: searching
      manifest: implementations/searching/binary-search/algorithm.yaml
    - id: arrays.prefix-sums
      title: Prefix sums
      subject: arrays
      manifest: implementations/arrays/prefix-sums/algorithm.yaml
    - id: graphs.dfs
      title: Depth-first search
      subject: graphs
      manifest: implementations/graphs/dfs/algorithm.yaml
    - id: graphs.bfs
      title: Breadth-first search
      subject: graphs
      manifest: implementations/graphs/bfs/algorithm.yaml
    - id: graphs.dijkstra
      title: Dijkstra's algorithm
      subject: graphs
      manifest: implementations/graphs/dijkstra/algorithm.yaml
    - id: graphs.dsu
      title: Disjoint set union
      subject: graphs
      manifest: implementations/graphs/dsu/algorithm.yaml
    - id: range-queries.fenwick-tree
      title: Fenwick tree
      subject: range-queries
      manifest: implementations/range-queries/fenwick-tree/algorithm.yaml
    - id: range-queries.segment-tree
      title: Segment tree
      subject: range-queries
      manifest: implementations/range-queries/segment-tree/algorithm.yaml
    - id: trees.lca
      title: Lowest common ancestor
      subject: trees
      manifest: implementations/trees/lca/algorithm.yaml
    - id: trees.heavy-light-decomposition
      title: Heavy-light decomposition
      subject: trees
      manifest: implementations/trees/heavy-light-decomposition/algorithm.yaml
    - id: dynamic-programming.0-1-knapsack
      title: 0/1 knapsack
      subject: dynamic-programming
      manifest: implementations/dynamic-programming/0-1-knapsack/algorithm.yaml
    - id: dynamic-programming.convex-hull-trick
      title: Convex hull trick
      subject: dynamic-programming
      manifest: implementations/dynamic-programming/convex-hull-trick/algorithm.yaml
