id: codeforces.812c.sagheer-and-nubian-market
title: Sagheer and Nubian Market
source: Codeforces
contest: Codeforces Round 417 (Div. 2)
division: silver
url: https://codeforces.com/problemset/problem/812/C
techniques:
    - foundations.loop-invariants
prerequisites:
    - foundations.complexity
    - foundations.sorting
    - searching.binary-search
    - searching.binary-search-on-answer
difficulty: 3
estimatedMinutes: 35
specialConstraints:
    - The surcharge on an item depends on the number of items bought, so every feasibility check must recompute the transformed costs for its own k.
    - Affordability is monotone in k, which is the property that justifies the binary search.
    - The answer can be k equal to zero when even one souvenir is too expensive.
    - The transformed costs reach 10^10, so the total must be accumulated in a 64-bit integer.
recommendedLanguages:
    - cpp17
    - java
    - python
hints:
    - If a set of k souvenirs fits the budget, then removing one souvenir leaves a set of k minus one that also fits.
    - For a fixed k, the best choice is the k smallest values of a[i] plus i times k.
    - Binary search on k, using the total cost of those k items as the feasibility test.
    - The invariant is that every k below lo is affordable and every k at or above hi is not.
discussion: >-
    The search is over the answer rather than over an array. The virtual array has one position for each possible k, and the predicate at position k asks whether the k cheapest transformed items fit the budget. Removing an item from a feasible set keeps it feasible, so the predicate is true on a prefix and false on a suffix. The half-open loop therefore applies unchanged, with the invariant that every k below lo is affordable and every k at or above hi is not. When the walls meet, lo is the first unaffordable k, and lo minus one is the largest affordable one. The final cost must be recomputed with the same k that produced the answer.
related:
    - codeforces.706b.interesting-drink
    - codeforces.702c.cellular-network
