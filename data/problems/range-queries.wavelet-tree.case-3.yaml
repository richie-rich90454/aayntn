id: cses.1734.distinct-values-queries
title: Distinct Values Queries
source: CSES
contest: CSES Problem Set
division: gold
url: https://cses.fi/problemset/task/1734
techniques:
    - range-queries.wavelet-tree
prerequisites:
    - arrays.coordinate-compression
    - range-queries.merge-sort-tree
difficulty: 4
estimatedMinutes: 40
specialConstraints:
    - The array and the number of queries both reach 200,000.
    - The values reach 10^9, so a frequency array indexed by value cannot be allocated.
    - A query asks for a count of distinct values in an inclusive 1-based range, not for the values themselves.
    - The queries must be answered from the input, and a scan of the range per query is quadratic.
recommendedLanguages:
    - cpp17
    - java
hints:
    - Count each distinct value at its first occurrence in the query range, so every value contributes exactly once.
    - Let prev[i] be the previous position holding the same value, or 0 when there is none; position i is the first occurrence in [l, r] exactly when prev[i] < l.
    - The answer becomes the number of positions i in [l, r] whose prev[i] is below l, which is a rank query on the array prev.
    - Build a wavelet tree over the compressed prev values and descend it with the threshold l, adding the left-branch counts whenever the threshold bit is 1.
discussion: >-
    Distinct counting is made local by charging each value to its first occurrence in the range. If prev[i] is the previous position with the same value, then i is that first occurrence exactly when prev[i] lies before l, so the query is a count of entries below a threshold over a subarray. A wavelet tree answers that count by descending the value bits of prev: at each level, a 1 bit of the threshold means every zero in the current range is below the threshold and can be added at once, while a 0 bit only permits the left branch. The position range is mapped through the same prefix counts that the k-th smallest query uses, so the cost is O(log N) per query and O(N log N) for the build. The values must be compressed first, because prev can be as large as N but not necessarily contiguous.
related:
    - librarychecker.range-kth-smallest
    - codeforces.840d.destiny
