id: hdu.1667.rotation-game
title: The Rotation Game
source: HDU
contest: 2004 Asia Regional Shanghai
url: https://acm.hdu.edu.cn/showproblem.php?pid=1667
techniques:
    - enumeration.iterative-deepening
prerequisites:
    - foundations.recursion
    - enumeration.backtracking
difficulty: 5
estimatedMinutes: 60
specialConstraints:
    - The board holds 24 cells and admits eight moves, so the reachable state space is far too large for a breadth-first search.
    - The answer is the minimum number of moves, and ties are broken by lexicographic order of the move string.
    - At most 30 test cases are given, so each one has to be solved without an expensive precomputation.
recommendedLanguages:
    - cpp17
    - java
hints:
    - The eight center cells must all show the same number; the count of the most frequent center value gives a lower bound on the number of cells that still must change.
    - A move can change at most one center cell, so the lower bound is admissible and the search is IDA*.
    - Try limits upward and prune when the current depth plus the bound exceeds the limit.
    - Generate moves in the order A through H so that the first solution found at the optimal limit is lexicographically smallest.
discussion: >-
    The rotation game is a shortest-path problem on a graph of board configurations, but the graph is generated by eight moves and has no compact index, so storing a visited set is the expensive part. Iterative deepening keeps a single board and the current move sequence, which is the memory advantage. The search is made practical by an admissible heuristic: if the eight center cells contain c copies of the most frequent number, then at least eight minus c of them must change, and one move changes at most one center cell. Pruning on depth plus that bound turns the depth-limited search into IDA*. The tie-break adds a second requirement: the moves are tried in alphabetical order, and the first success at the smallest successful limit is the lexicographically smallest shortest solution. Reversing the previous move is never useful and can be skipped.
related:
    - poj.3134.power-calculus
    - hdu.1560.dna-sequence
