id: usaco.2017.jan.silver.secret-cow-code
title: Secret Cow Code
source: USACO
contest: 2017 January Contest
division: silver
url: https://usaco.org/index.php?page=viewproblem2&cpid=692
editorialUrl: https://usaco.org/current/data/sol_cowcode_silver_jan17.html
techniques:
    - foundations.recursion
    - strings.kmp
prerequisites:
    - foundations.recursion
difficulty: 2
estimatedMinutes: 25
specialConstraints:
    - The string doubles at every step, so it can become astronomically long, and the index can be as large as a billion.
recommendedLanguages:
    - cpp17
    - java
    - python
hints:
    - The string is built by repeated doubling, so it is a fixed infinite word and the question asks for one character of it.
    - At each step the last character moves to the front, so the character at position i of the new string is the character at position i minus one of the old string once i is at least one.
    - That gives a recursive rule. Reduce the index, and when the reduction lands on the character that was moved to the front the answer is known.
    - Work out how the index changes when you go back one step, recurse, and memoize the answers so the recursion is fast.
discussion: >-
    The construction is an infinite word with a simple recursive structure, and the only thing to track is how a requested index maps back to the previous level. The recursion therefore follows a single index downward instead of building any string, and the depth is logarithmic in the number of steps. The boundary case, where the index lands on the character that was moved to the front, is where the recursion has to stop.
