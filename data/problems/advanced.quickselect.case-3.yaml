id: kattis.median
title: Median
source: Kattis
contest: BYU High School Programming Contest 2026
division: bronze
url: https://open.kattis.com/problems/median
techniques:
    - advanced.quickselect
prerequisites:
    - foundations.sorting
    - foundations.complexity
difficulty: 2
estimatedMinutes: 20
specialConstraints:
    - The array holds between 1 and 100000 integers.
    - Every integer is between 0 and 1000000000 inclusive.
    - When n is even the answer is the mean of the two middle values, so both middle order statistics are needed.
    - The sum of the two middle values can reach two billion, so a 64-bit accumulator is the safe choice.
recommendedLanguages:
    - cpp17
    - java
    - python
hints:
    - The lower middle index is (n - 1) / 2 and the upper middle index is n / 2; for odd n they are the same position.
    - Select each needed index with a partition and keep only the side that holds it.
    - For even n, both selections are independent, and either one may permute the array.
    - Combine the selected values as the statement asks, and use a wider accumulator for the sum.
discussion: >-
    The answer is one or two order statistics of a static array. The odd case is a single selection at index (n - 1) / 2. The even case needs the lower middle and the upper middle, at indices (n - 1) / 2 and n / 2, and then combines them. Each selection costs expected linear time, so the pair still costs expected linear time with a small constant. The naive sort costs O(n log n) and is acceptable at n = 100000, but the problem is a clean place to see that a median is a rank query rather than a reason to order everything. The large value bound is the other trap: the sum of two middle values leaves little headroom below the signed 32-bit limit.
related:
    - hackerrank.find-the-median
    - poj.2388.whos-in-the-middle
