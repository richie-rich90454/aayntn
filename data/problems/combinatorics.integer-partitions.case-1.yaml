id: hdu.1028.ignatius-and-the-princess-iii
title: Ignatius and the Princess III
source: HDU
contest: HDU Online Judge
division: silver
url: https://acm.hdu.edu.cn/showproblem.php?pid=1028
techniques:
    - combinatorics.integer-partitions
prerequisites:
    - foundations.complexity
difficulty: 2
estimatedMinutes: 20
specialConstraints:
    - The input holds several test cases and ends at end of file, so the table is precomputed once up to the largest query.
    - n is at most 120, so the exact partition count fits in a signed 32-bit integer for every case, but a 64-bit counter is safer.
    - The parts are unordered, so 3 + 1 and 1 + 3 are the same partition.
recommendedLanguages:
    - cpp17
    - java
    - python
hints:
    - The answer is the partition function p(n), not the number of compositions, so the order of the parts is ignored.
    - Precompute p(0) through p(120) once with the pentagonal recurrence, then answer every query by lookup.
    - Form the generalized pentagonal offset k(3k - 1)/2 in 64-bit arithmetic, because the product is formed before the division.
discussion: >-
    The problem is the textbook statement of the partition function, with a small bound that makes almost any correct method fast enough. The pentagonal recurrence is still the right choice because it answers the whole table in one pass and needs no per-part enumeration. The offsets come in pairs from k(3k - 1)/2 and k(3k + 1)/2, the sign is positive for odd k and negative for even k, and the table is filled from p(0) = 1 upward. Reading all queries first and precomputing to the largest one keeps the total cost at one table build.
related:
    - project-euler.76.counting-summations
    - project-euler.78.coin-partitions
