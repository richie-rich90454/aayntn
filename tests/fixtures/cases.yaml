          -1000000000 -1000000000 0 1000000000 0
          1 5
          1 2
          2 4
      expected: |
          3
          1
          3
    - name: single element queried repeatedly
      input: |
          1 3
          42
          1 1
          1 1
          1 1
      expected: |
          1
          1
          1

arrays.two-dimensional-difference-arrays:
