# Shared test fixtures for the reference implementations.
#
# Every language of an algorithm must produce the same output for the same
# input, so the fixtures are shared rather than per language. The `expected`
# field is the exact standard output, with line feeds only; the validator
# normalizes the line endings before it compares.
#
# The `program` variant of each algorithm implements the contract described
# here. The reusable variants carry their own self-checks and are run with an
# empty input.

searching.binary-search:
    - name: target present in the middle
      input: "9\n1 3 5 7 9 11 13 15\n5\n"
      expected: "2\n"
    - name: target absent
      input: "9\n1 3 5 7 9 11 13 15\n8\n"
      expected: "-1\n"
    - name: target is the first element
      input: "3\n1 2 3\n1\n"
      expected: "0\n"
    - name: empty array
      input: "0\n"
      expected: "-1\n"
    - name: duplicate values return a matching index
      input: "5\n2 2 2 2 2\n2\n"
      expected: "2\n"

arrays.prefix-sums:
    - name: three ranges over five values
      input: "5\n1 2 3 4 5\n3\n1 3\n2 5\n1 1\n"
      expected: "6\n14\n1\n"
    - name: negative values
      input: "4\n-5 10 -5 10\n2\n1 4\n2 3\n"
      expected: "10\n5\n"
    - name: a single element
      input: "1\n7\n1\n1 1\n"
      expected: "7\n"
    - name: no queries
      input: "3\n1 2 3\n0\n"
      expected: ""

