graphs.floyd-warshall:
    - name: a cheaper route through two intermediates and an unreachable pair
      input: |
          4 5
          0 1 5
          0 2 1
          2 1 1
          1 3 2
          2 3 20
      expected: |
          0 2 1 4
          -1 0 -1 2
          -1 1 0 3
          -1 -1 -1 0
    - name: a negative edge without a negative cycle
      input: |
          4 5
          0 1 4
          0 2 5
          1 2 -3
          2 3 2
          3 0 1
      expected: |
          0 4 1 3
          0 0 -3 -1
          3 7 0 2
          1 5 2 0
    - name: "edge case: a negative cycle is reported"
      input: |
          3 3
          0 1 1
          1 2 -2
          2 0 -1
      expected: |
          negative cycle

