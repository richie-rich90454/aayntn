# Shared test fixtures for the reference implementations.
#
# Every language of an algorithm must produce the same output for the same
# input, so the fixtures are shared rather than per language. The `expected`
# field is the exact standard output, with line feeds only; the validator
# normalizes the line endings before it compares.
#
# The `program` variant of each algorithm implements the contract described
# here. The reusable variants carry their own self-checks and are run with an
# empty input.

searching.binary-search:
    - name: target present in the middle
      input: "9\n1 3 5 7 9 11 13 15\n5\n"
      expected: "2\n"
    - name: target absent
      input: "9\n1 3 5 7 9 11 13 15\n8\n"
      expected: "-1\n"
    - name: target is the first element
      input: "3\n1 2 3\n1\n"
      expected: "0\n"
    - name: empty array
      input: "0\n"
      expected: "-1\n"
    - name: duplicate values return a matching index
      input: "5\n2 2 2 2 2\n2\n"
      expected: "2\n"

arrays.prefix-sums:
    - name: three ranges over five values
      input: "5\n1 2 3 4 5\n3\n1 3\n2 5\n1 1\n"
      expected: "6\n14\n1\n"
    - name: negative values
      input: "4\n-5 10 -5 10\n2\n1 4\n2 3\n"
      expected: "10\n5\n"
    - name: a single element
      input: "1\n7\n1\n1 1\n"
      expected: "7\n"
    - name: no queries
      input: "3\n1 2 3\n0\n"
      expected: ""

graphs.dfs:
    - name: a path of five vertices
      input: "5 4\n0 1\n1 2\n2 3\n3 4\n0\n"
      expected: "5\n0 1 2 3 4\n"
    - name: the start is isolated
      input: "4 1\n0 1\n3\n"
      expected: "1\n3\n"
    - name: a cycle
      input: "4 4\n0 1\n1 2\n2 0\n2 3\n0\n"
      expected: "4\n0 1 2 3\n"
    - name: a single vertex
      input: "1 0\n0\n"
      expected: "1\n0\n"

graphs.bfs:
    - name: a path of five vertices
      input: "5 4\n0 1\n1 2\n2 3\n3 4\n0\n"
      expected: "0 1 2 3 4\n"
    - name: the start is isolated
      input: "4 1\n0 1\n3\n"
      expected: "-1 -1 -1 0\n"
    - name: a tree with two branches
      input: "7 6\n0 1\n0 2\n1 3\n1 4\n2 5\n2 6\n0\n"
      expected: "0 1 1 2 2 2 2\n"
    - name: a single vertex
      input: "1 0\n0\n"
      expected: "0\n"

graphs.dijkstra:
    - name: a weighted graph with a cheaper detour
      input: "5 4\n0 1 4\n0 2 2\n1 2 1\n2 3 8\n0\n"
      expected: "0 3 2 10 -1\n"
    - name: the start is isolated
      input: "3 1\n0 1 5\n2\n"
      expected: "-1 -1 0\n"
    - name: equal weights
      input: "4 3\n0 1 1\n1 2 1\n2 3 1\n0\n"
      expected: "0 1 2 3\n"
    - name: a zero weight edge
      input: "3 2\n0 1 0\n1 2 0\n0\n"
      expected: "0 0 0\n"

graphs.dsu:
    - name: three queries over two unions
      input: "5 6\n1 0 1\n1 2 3\n2 0 1\n2 0 2\n1 1 3\n2 0 3\n"
      expected: "yes\nno\nyes\n"
    - name: no queries
      input: "4 0\n"
      expected: ""
    - name: a query before any union
      input: "3 1\n2 0 1\n"
      expected: "no\n"

dynamic-programming.0-1-knapsack:
    - name: the optimum takes two items
      input: "4 7\n3 4\n4 5\n5 7\n2 3\n"
      expected: "10\n"
    - name: no items
      input: "0 10\n"
      expected: "0\n"
    - name: the capacity fits every item
      input: "3 5\n1 10\n2 20\n3 30\n"
      expected: "50\n"
    - name: nothing fits
      input: "2 3\n5 100\n6 200\n"
      expected: "0\n"

range-queries.fenwick-tree:
    - name: two range sums
      input: "5 4\n1 1 5\n1 2 3\n2 1 2\n2 1 5\n"
      expected: "8\n8\n"
    - name: a negative update
      input: "4 3\n1 1 10\n1 2 -4\n2 1 2\n"
      expected: "6\n"
    - name: a single element range
      input: "3 2\n1 2 7\n2 2 2\n"
      expected: "7\n"
    - name: no queries
      input: "3 0\n"
      expected: ""

range-queries.segment-tree:
    - name: two range sums
      input: "5 4\n1 1 5\n1 2 3\n2 1 2\n2 1 5\n"
      expected: "8\n8\n"
    - name: a negative update
      input: "4 3\n1 1 10\n1 2 -4\n2 1 2\n"
      expected: "6\n"
    - name: a single element range
      input: "3 2\n1 2 7\n2 2 2\n"
      expected: "7\n"
    - name: no queries
      input: "3 0\n"
      expected: ""

trees.lca:
    - name: three queries over one tree
      input: "5 4\n0 1\n0 2\n1 3\n1 4\n3\n3 4\n2 3\n0 4\n"
      expected: "1\n0\n0\n"
    - name: a query of a vertex with itself
      input: "3 2\n0 1\n1 2\n1\n2 2\n"
      expected: "2\n"
    - name: a chain
      input: "4 3\n0 1\n1 2\n2 3\n1\n3 0\n"
      expected: "0\n"

trees.heavy-light-decomposition:
