          6 7 3 4
          10 11 4 5
          9 10 8 9
    - name: negative values and a full-grid update
      input: |
          2 3
          -5 0 5
          10 -10 2
          3
          1 1 2 3 1
          1 2 1 2 -7
          2 1 2 3 100
      expected: |
          -4 -6 6
          111 91 103
    - name: single cell with no updates
      input: |
          1 1
          7
          0
      expected: |
          7

