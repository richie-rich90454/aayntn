dynamic-programming.convex-hull-trick:
    - name: three queries over three lines
      input: "3 3\n1 0\n2 -1\n3 -3\n0\n1\n2\n"
      expected: "-3\n0\n2\n"
    - name: a single line
      input: "1 2\n2 5\n0\n4\n"
      expected: "5\n13\n"
    - name: no lines
      input: "0 1\n0\n"
      expected: "0\n"

enumeration.meet-in-the-middle:
    - name: every subset fits under the limit
      input: |
          4 10
          1 2 3 4
      expected: |
          16
    - name: the limit cuts the large subsets
      input: |
          5 5
          1 2 3 4 5
      expected: |
          10
    - name: edge case with zero values and an empty subset
      input: |
          2 0
          0 0
      expected: |
          4

range-queries.mos-algorithm:
    - name: overlapping ranges over a small array
      input: |
          7 4
          1 2 1 3 2 4 1
          1 7
          2 5
          3 3
          4 6
      expected: |
          4
          3
          1
          3
    - name: negative and large values are compressed
      input: |
