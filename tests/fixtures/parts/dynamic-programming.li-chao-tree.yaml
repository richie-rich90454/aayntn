- name: interleaved insertions and queries
  input: "7\n1 1 0\n1 -1 6\n2 0\n2 5\n1 3 -4\n2 2\n2 6\n"
  expected: "0\n1\n2\n0\n"
- name: a single coordinate with a duplicate slope and a replacing line
  input: "7\n1 0 -5\n2 7\n1 0 -5\n1 2 -20\n2 7\n2 7\n2 7\n"
  expected: "-5\n-6\n-6\n-6\n"
- name: many lines that never beat the first
  input: "9\n1 0 10\n1 1 100\n1 -1 100\n1 2 100\n2 -5\n2 0\n2 5\n2 100\n2 -100\n"
  expected: "10\n10\n10\n0\n-100\n"
