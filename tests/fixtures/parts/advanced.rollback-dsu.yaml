- name: a rollback splits the merged component
  input: "6 10\nunion 1 2\nunion 3 4\nunion 2 4\nsame 2 4\nrollback\nsame 2 3\nunion 5 6\nsame 5 6\nrollback\nsame 5 6\n"
  expected: "YES\nNO\nYES\nNO\n"
- name: an empty rollback and a redundant union are both harmless
  input: "3 9\nrollback\nsame 1 2\nunion 1 2\nunion 1 2\nrollback\nsame 1 2\nrollback\nsame 1 2\nrollback\n"
  expected: "NO\nYES\nNO\n"
- name: three nested merges and three rollbacks
  input: "6 12\nunion 1 2\nunion 3 4\nunion 1 3\nunion 5 6\nunion 4 5\nsame 2 6\nrollback\nsame 2 6\nrollback\nsame 2 4\nrollback\nsame 2 4\n"
  expected: "YES\nNO\nYES\nNO\n"
