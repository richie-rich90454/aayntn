- name: two equal runs, with both SAME and DIFFERENT answers
  input: "aabbaa\n6\n0 1\n0 2\n2 3\n1 4\n0 5\n3 5\n"
  expected: "SAME\nDIFFERENT\nSAME\nDIFFERENT\nDIFFERENT\nDIFFERENT\n"
- name: one odd character between long equal blocks
  input: "aaabaaa\n5\n0 2\n0 3\n3 6\n4 6\n1 1\n"
  expected: "SAME\nDIFFERENT\nDIFFERENT\nSAME\nSAME\n"
- name: edge case with the shortest nontrivial string and reversed indices
  input: "ab\n4\n0 1\n1 0\n0 0\n1 1\n"
  expected: "DIFFERENT\nDIFFERENT\nSAME\nSAME\n"
