- name: five sites with two ties
  input: "5 4\n0 0\n4 0\n4 4\n0 4\n2 2\n1 1\n3 1\n2 3\n4 4\n"
  expected: "1\n2\n5\n3\n"
- name: negative coordinates and symmetric ties
  input: "4 5\n-3 -2\n3 -2\n3 4\n-3 4\n0 -2\n0 0\n0 3\n-3 0\n3 0\n"
  expected: "1\n1\n3\n1\n2\n"
- name: edge case, a single site and repeated queries
  input: "1 3\n0 0\n0 0\n-1000000 -1000000\n1000000 1000000\n"
  expected: "1\n1\n1\n"
