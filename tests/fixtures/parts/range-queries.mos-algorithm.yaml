- name: overlapping ranges over a small array
  input: "7 4\n1 2 1 3 2 4 1\n1 7\n2 5\n3 3\n4 6\n"
  expected: "4\n3\n1\n3\n"
- name: negative and large values are compressed
  input: "5 3\n-1000000000 -1000000000 0 1000000000 0\n1 5\n1 2\n2 4\n"
  expected: "3\n1\n3\n"
- name: single element queried repeatedly
  input: "1 3\n42\n1 1\n1 1\n1 1\n"
  expected: "1\n1\n1\n"
