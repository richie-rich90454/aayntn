- name: zeros split the range
  input: "6\n3 0 4 5 0 2\n5\n1 6\n3 4\n1 1\n2 5\n6 6\n"
  expected: "0\n20\n3\n0\n2\n"
- name: negative values reduced modulo the prime
  input: "4\n-1 2 -3 4\n5\n1 4\n2 3\n1 3\n4 4\n2 2\n"
  expected: "24\n1000000001\n6\n4\n2\n"
- name: edge case where multiples of the modulus become zeros
  input: "3\n1000000007 -1000000007 5\n4\n1 1\n2 3\n3 3\n1 3\n"
  expected: "0\n0\n5\n0\n"
