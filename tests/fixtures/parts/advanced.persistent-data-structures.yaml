- name: pushes, a branch, pops, and empty queries share nodes
  input: "12\n1 0 5\n1 1 7\n3 2\n2 2\n3 3\n3 1\n2 1\n3 4\n2 0\n3 5\n1 4 9\n3 6\n"
  expected: "7\n5\n5\n-1\n-1\n9\n"
- name: two branches from one version stay independent
  input: "12\n1 0 1\n1 1 2\n1 1 3\n3 2\n3 3\n2 2\n2 3\n3 4\n3 5\n3 1\n2 5\n3 6\n"
  expected: "2\n3\n1\n1\n1\n-1\n"
- name: an edge case with no pushes, repeated pops of empty versions, and a negative value
  input: "10\n3 0\n2 0\n3 1\n3 0\n1 1 -7\n2 2\n3 3\n3 2\n2 3\n3 4\n"
  expected: "-1\n-1\n-1\n-1\n-7\n-1\n"
