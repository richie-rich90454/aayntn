- name: duplicates and interior order statistics
  input: "8 4\n5 2 8 1 9 3 7 4\n1 7 3\n0 8 1\n0 8 8\n2 3 1\n"
  expected: "3\n1\n9\n8\n"
- name: negative values and shifted ranges
  input: "5 4\n-5 -1 0 -3 2\n0 5 1\n0 5 5\n1 4 2\n3 4 1\n"
  expected: "-5\n2\n-1\n-3\n"
- name: a single position, duplicates, and repeated extremes
  input: "3 5\n-2 5 -2\n0 3 1\n0 3 2\n0 3 3\n0 1 1\n2 3 1\n"
  expected: "-2\n-2\n5\n-2\n-2\n"
