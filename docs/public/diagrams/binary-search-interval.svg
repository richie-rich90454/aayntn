<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" width="660" height="200" role="img" aria-labelledby="bs-title bs-desc">
  <title id="bs-title">The binary search interval</title>
  <desc id="bs-desc">
    A sorted array of nine cells. The current search interval is marked in cobalt
    and contains the cells from index two to index six. The midpoint is index
    four, marked in gold. The cells to the left and to the right of the
    interval are marked as discarded.
  </desc>

  <g font-family="Noto Sans, sans-serif">
    <g stroke="#D5D9E4" stroke-width="1.2">
      <rect x="20" y="60" width="64" height="48" fill="#F1F3F8"/>
      <rect x="88" y="60" width="64" height="48" fill="#F1F3F8"/>
      <rect x="156" y="60" width="64" height="48" fill="#2847B8"/>
      <rect x="224" y="60" width="64" height="48" fill="#FFFFFF"/>
      <rect x="292" y="60" width="64" height="48" fill="#E8B84A"/>
      <rect x="360" y="60" width="64" height="48" fill="#FFFFFF"/>
      <rect x="428" y="60" width="64" height="48" fill="#2847B8"/>
      <rect x="496" y="60" width="64" height="48" fill="#F1F3F8"/>
      <rect x="564" y="60" width="64" height="48" fill="#F1F3F8"/>
    </g>

    <g font-size="14" font-family="Noto Sans Mono, monospace" text-anchor="middle">
      <text x="52" y="90" fill="#6B7484">1</text>
      <text x="120" y="90" fill="#6B7484">3</text>
      <text x="188" y="90" fill="#FFFFFF">5</text>
      <text x="256" y="90" fill="#161616">7</text>
      <text x="324" y="90" fill="#161616">9</text>
      <text x="392" y="90" fill="#161616">11</text>
      <text x="460" y="90" fill="#FFFFFF">13</text>
      <text x="528" y="90" fill="#6B7484">15</text>
      <text x="596" y="90" fill="#6B7484">17</text>
    </g>

    <g font-size="11" text-anchor="middle" fill="#6B7484">
      <text x="52" y="128">0</text>
      <text x="120" y="128">1</text>
      <text x="188" y="128">2</text>
      <text x="256" y="128">3</text>
      <text x="324" y="128">4</text>
      <text x="392" y="128">5</text>
      <text x="460" y="128">6</text>
      <text x="528" y="128">7</text>
      <text x="596" y="128">8</text>
    </g>

    <g stroke="#161616" stroke-width="1.4" fill="none">
      <path d="M156 44 V36 M428 44 V36 M156 36 H428"/>
      <path d="M156 36 l6 -4 v8 Z" fill="#161616"/>
      <path d="M428 36 l-6 -4 v8 Z" fill="#161616"/>
    </g>
    <text x="292" y="28" text-anchor="middle" font-size="12" font-family="Noto Sans, sans-serif" fill="#161616">
      the interval [lo, hi] = [2, 6]
    </text>

    <path d="M324 108 V140" stroke="#161616" stroke-width="1.4"/>
    <text x="324" y="158" text-anchor="middle" font-size="12" font-family="Noto Sans, sans-serif" fill="#161616">
      mid = 4
    </text>

    <g font-size="11" font-family="Noto Sans, sans-serif" fill="#6B7484">
      <text x="52" y="178" text-anchor="middle">discarded</text>
      <text x="120" y="178" text-anchor="middle">discarded</text>
      <text x="188" y="178" text-anchor="middle">candidate</text>
      <text x="256" y="178" text-anchor="middle">candidate</text>
      <text x="324" y="178" text-anchor="middle">midpoint</text>
      <text x="392" y="178" text-anchor="middle">candidate</text>
      <text x="460" y="178" text-anchor="middle">candidate</text>
      <text x="528" y="178" text-anchor="middle">discarded</text>
      <text x="596" y="178" text-anchor="middle">discarded</text>
    </g>
  </g>
</svg>
