algorithm: range-queries.wavelet-tree
title: Wavelet trees
summary: A wavelet tree stable-partitions a static array by the bits of its values, so a range rank query or a range k-th smallest query descends one logarithmic level at a time.
subject: range-queries
divisions: [gold, platinum]
importance: advanced-technique
prerequisites:
    required:
        [range-queries.merge-sort-tree, searching.binary-search, arrays.coordinate-compression]
    recommended: [range-queries.segment-tree, range-queries.fenwick-tree, foundations.sorting]
complexity:
    time: "O(log sigma) per k-th smallest or rank query; O(n log sigma) to build"
    space: "O(n log sigma) prefix counts, plus O(n) working arrays"
assumptions:
    - The array is static, because an update has to repair one stable partition at every level.
    - The values are coordinate-compressed to ranks, so the height of the tree is the logarithm of the number of distinct values.
    - A query names a 0-based half-open position range [l, r) and an order k with 1 <= k <= r - l.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the array and the order-statistic queries from stdin and prints one k-th smallest value per query."
      time: "O(log sigma) per query; O(n log sigma) to build"
      auxiliarySpace: "O(n log sigma) int prefix counts, plus two O(n) rank buffers"
      status: unverified
      inputs: 'n q, then the n values, then q lines "l r k" with 0-based half-open bounds.'
      outputs: "One line per query, holding the k-th smallest value in the half-open range [l, r)."
      notes: "Every level stores a prefix count of the elements that descend to the left child, and the elements are stable partitioned before the next level. A query maps [l, r) through the prefix counts and subtracts the zeros from k when it descends right. The C variant owns every level with malloc and frees each one after the last query, so the whole structure is released on every exit path."
      operations: [build, kth-smallest]
