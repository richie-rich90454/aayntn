      reason: "The canonical program: it reads the array and the order-statistic queries from stdin and prints one k-th smallest value per query."
      time: "O(n log n) to build; O(log n) per query"
      auxiliarySpace: "O(n log n) nodes, about (n + 1)(ceil(log2 m) + 2) of them"
      status: unverified
      inputs: 'n q, then the n values, then q lines "l r k" with 1-based inclusive bounds.'
      outputs: "One line per query, holding the k-th smallest value in the inclusive range [l, r]."
      notes: "Version i is the frequency tree of the first i values, and only the root-to-leaf path of the new value is copied, so the old versions stay valid. The C variant allocates the three node arrays with calloc, treats node 0 as the empty node, and frees every array after the last query."
