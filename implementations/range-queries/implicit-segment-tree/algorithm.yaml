      status: unverified
      inputs: 'm q, then q operations: "1 p v" adds v to the 1-based position p and "2 l r" queries the inclusive range [l, r]. Every position starts at zero.'
      outputs: "One line per query, holding the range sum."
      notes: "Node 0 is the null node, so a missing child needs no special case beyond returning zero. The pool is sized from q and the height of the domain, and every update creates at most one node per level. The sum is a 64-bit integer because a total can reach 2 * 10^14."
