algorithm: range-queries.lazy-propagation
title: Lazy propagation
summary: A segment tree records a range update at the nodes it fully covers and defers the update to their children until a query needs them, so range updates and range queries both take logarithmic time.
subject: range-queries
divisions: [gold, platinum]
importance: common-contest-technique
prerequisites:
    required: [range-queries.segment-tree]
    recommended: [range-queries.fenwick-tree, arrays.difference-arrays]
complexity:
    time: "O(log n) per range update and per range query"
    space: "O(n)"
assumptions:
    - The query aggregate is associative and has an identity, so a node can cache the aggregate of its range.
    - A pending update can be applied to a whole node in constant time and composed with another pending update in constant time.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the operations from stdin and prints one range sum per query."
      time: "O(log n) per range update and per range query"
      auxiliarySpace: "O(n) for the tree and the lazy tags"
      status: unverified
      inputs: 'n q, then q operations: "1 l r delta" adds delta to every position in the inclusive range [l, r], and "2 l r" queries the inclusive range sum. Every position starts at zero.'
      outputs: "One line per query, holding the range sum."
      notes: "tree[i] holds the sum of the node's range and lazy[i] holds the addition that is already included in tree[i] but not yet in its children. A full cover applies the delta and stops; a partial cover pushes the tag to both children before descending. The C variant allocates both arrays in an explicit init and releases them in a destroy, so every successful init must be matched by exactly one destroy."
      operations: [range-add, range-sum]
