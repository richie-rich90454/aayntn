      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the array and the order-statistic queries from stdin and prints one k-th smallest value per query."
      time: "O(log^2 n) per rank query; O(log C log^2 n) per k-th smallest query"
      auxiliarySpace: "O(n log n) entries across the sorted lists, plus O(n) tree nodes"
      status: unverified
      inputs: 'n q, then the n values, then q lines "l r k" with 1-based inclusive bounds.'
      outputs: "One line per query, holding the k-th smallest value in the inclusive range [l, r]."
      notes: "The tree is built bottom-up by merging the children's sorted lists, and the k-th smallest is the least value whose rank in the range reaches k, found by binary search over the value range. The C variant allocates one array per nonempty node and frees every list after the last query."
