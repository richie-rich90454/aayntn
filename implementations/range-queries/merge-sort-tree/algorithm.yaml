algorithm: range-queries.merge-sort-tree
title: Merge sort trees
summary: A segment tree whose nodes keep the values of their intervals sorted answers a range rank query by binary searching the nodes that cover the range, at a cost of one logarithmic factor for the nodes and one for the searches.
subject: range-queries
divisions: [gold, platinum]
importance: common-contest-technique
prerequisites:
    required: [range-queries.segment-tree, searching.binary-search, foundations.sorting]
    recommended: [arrays.coordinate-compression, range-queries.fenwick-tree]
complexity:
    time: "O(log^2 n) per rank query; O(log C log^2 n) per k-th smallest query"
    space: "O(n log n)"
assumptions:
    - The array is static, because repairing a node's sorted list after a point update costs the size of that list.
reviewed: false
