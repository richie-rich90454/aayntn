      status: unverified
      inputs: 'n q, then q operations: "1 i delta" adds delta to the 1-based position i and "2 l r" queries the inclusive range [l, r].'
      outputs: "One line per query, holding the range sum."
      notes: "The C variant allocates the values and the block sums with calloc and releases both with free, so the two arrays live for the whole run. The block size is computed with integer arithmetic, which avoids a libm dependency and the rounding surprises of sqrt."
