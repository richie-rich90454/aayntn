algorithm: range-queries.mos-algorithm
title: Mo's algorithm
summary: Answer a batch of range queries on a static array by sorting the queries into blocks and moving one maintained window instead of rescanning every range.
subject: range-queries
divisions: [gold, platinum]
importance: specialized-technique
complexity:
    time: "O(q log q + (n + q) sqrt n) for the batch"
    space: "O(n + q)"
assumptions:
    - The array never changes, and every query is known before the first answer is produced.
    - The answer can be maintained in constant time when one element is added to or removed from either end of the current range.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the array and the queries from stdin and prints the distinct count of every range in the original order."
      time: "O(q log q + (n + q) sqrt n) for the batch"
      auxiliarySpace: "O(n + q) for the rank table, the frequency table, the sorted queries and the answers"
      status: unverified
      inputs: 'n q, then n signed 32-bit values, then q pairs "l r" with 1 <= l <= r <= n.'
      outputs: "One line per query, holding the number of distinct values in a[l..r], in the input order."
      notes: "Values are compressed to dense ranks, the queries are sorted by the block of the left endpoint with the right endpoint alternating direction, and the window holds the frequency table and the running distinct count. The block width is the largest integer whose square is at most n, clamped to one, so the comparator never divides by zero. The C variant owns its arrays through malloc and free, so every successful allocation is released before main returns."
      operations: [add, remove, distinct-count]
