algorithm: range-queries.segment-tree
title: Segment tree
summary: A binary tree over the array keeps the sum of every range in a node, so a point assignment and an inclusive range sum both take logarithmic time.
subject: range-queries
divisions: [gold, platinum]
importance: common-contest-technique
complexity:
    time: "O(log n) per operation"
    space: "O(n)"
assumptions:
    - The combining operation is associative, which is what lets a node cache the result of merging its two children.
reviewed: false
variants:
    - id: minimal
      language: c
      file: c/minimal.c
      kind: minimal
      recommended: recommended
      reason: "Reusable struct with an explicit init/destroy pair supporting a point assignment and an inclusive range sum over a 1-indexed array; no I/O."
      time: "O(log n) per operation"
      auxiliarySpace: "O(n) for the tree of 4n + 4 entries"
      status: unverified
      inputs: "A tree of n positions built from the values of the positions 1..n, a 1-based index for every assignment and an inclusive range for every query."
      outputs: "The sum of the positions left..right, both inclusive."
      notes: "tree[node] holds the sum of the range the node covers, so a node caches the result of merging its two children. An assignment walks down to the leaf and merges the two children on the way back up, and a query descends into the children that overlap the range and adds the sums of the nodes that are fully covered. The C variant owns its storage through an explicit init/destroy pair: init allocates and destroy frees, so every successful init must be matched by exactly one destroy and the tree must not be used afterwards. The values array belongs to the caller and is only read while the tree is built."
      operations: [build, point-update, range-query, merge]
