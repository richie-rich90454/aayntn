      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the operations from stdin and prints one range sum per query."
      time: "O(log n) per operation"
      auxiliarySpace: "O(n) for the tree of 4n + 4 entries"
      status: unverified
      inputs: 'n q, then q operations: "1 i v" assigns the value v to the 1-based position i and "2 l r" queries the inclusive range [l, r].'
      outputs: "One line per query, holding the range sum."
      notes: "Every position starts at zero, because the input carries no initial values. An assignment outside 1..n is ignored and a range that is empty after the clamping to the array sums to zero, and the output is one canonical line per query so the six language versions are byte-identical."
