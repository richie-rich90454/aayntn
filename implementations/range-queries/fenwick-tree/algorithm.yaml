algorithm: range-queries.fenwick-tree
title: Fenwick tree
summary: A binary indexed tree keeps the prefix sums of a 1-indexed array up to date, so point updates and range sum queries both take logarithmic time.
subject: range-queries
divisions: [gold, platinum]
importance: common-contest-technique
complexity:
    time: "O(log n) per operation"
    space: "O(n)"
assumptions:
    - The underlying operation is addition, which is invertible, so a prefix sum can be subtracted from another prefix sum.
reviewed: false
variants:
    - id: minimal
      language: c
      file: c/minimal.c
      kind: minimal
      recommended: recommended
      reason: "Reusable struct with an explicit init/destroy pair supporting point addition, prefix sums and range sums over a 1-indexed array; no I/O."
      time: "O(log n) per operation"
      auxiliarySpace: "O(n) for the tree of n + 1 entries"
      status: unverified
      inputs: "A tree of n positions and a 1-based index for every update and query."
      outputs: "The prefix sum of positions 1..index and the sum of the inclusive range left..right."
      notes: "tree[i] holds the sum of the positions in the block (i - lowbit(i), i], so add walks up the blocks that contain the index while prefix_sum walks down the disjoint blocks that partition 1..index, and a range sum is the difference of two prefix sums. The C variant owns its storage through an explicit init/destroy pair: init allocates and destroy frees, so every successful init must be matched by exactly one destroy and the tree must not be used afterwards."
      operations: [add, prefix-sum, range-sum]
