algorithm: arrays.prefix-sums
title: Prefix sums
summary: Precompute the running totals of an array once, so that every later range sum is a single subtraction.
subject: arrays
divisions: [silver]
importance: core-prerequisite
complexity:
    time: "O(n + q)"
    space: "O(n)"
assumptions:
    - Queries are given after the array, so the prefix sums can be precomputed once.
reviewed: false
variants:
    - id: minimal
      language: c
      file: c/minimal.c
      kind: minimal
      recommended: recommended
      reason: "Reusable function that fills a prefix-sum array, so a range sum becomes the difference of two prefix entries."
      time: "O(n)"
      auxiliarySpace: "O(n)"
      status: unverified
      inputs: "An array of n values and a caller-provided buffer."
      outputs: "A prefix-sum array of n+1 entries: prefix[0] = 0 and prefix[i] = prefix[i-1] + a[i-1]."
      notes: "The function performs no I/O. The caller owns the output buffer, which must have room for n+1 elements, and the function allocates nothing and frees nothing. The sums are 64-bit because the documented range reaches |sum| = 10^15."
      operations: [accumulate-prefix]
