algorithm: advanced.sprague-grundy
title: Game theory and Sprague-Grundy theory
summary: Summarize every impartial game position by one non-negative integer, its Grundy value, so that a sum of independent games is decided by the xor of those values.
subject: advanced
divisions: [platinum]
importance: advanced-technique
prerequisites:
    required: [foundations.complexity]
    recommended:
        [foundations.recursion, foundations.binary-representation, dynamic-programming.dag-dp]
complexity:
    time: "O(M k + h) to tabulate the Grundy values up to the largest heap"
    space: "O(M + k)"
assumptions:
    - Every game is finite and impartial, and the player who cannot move loses under normal play.
    - The position is a disjunctive sum of independent components, so exactly one component changes per move.
    - The Grundy table is built up to the largest heap size in the input, and every move removes a fixed positive number of stones.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the allowed moves and the heap sizes, then prints the Grundy value of each heap and the winner of the combined position."
      time: "O(M k + h)"
      auxiliarySpace: "O(M + k)"
      status: unverified
      inputs: "k, then k allowed move sizes, then h, then h heap sizes, all separated by whitespace."
      outputs: "One line per heap with its Grundy value, then one line holding first or second."
      notes: "The table is built up to the largest heap, so a move is used only when it does not exceed the current size. The marker array is stamped with the current size instead of being cleared, and the mex loop stops after at most k + 1 steps because at most k values can be marked. The three arrays are freed on every exit path."
      operations: [tabulate-grundy, mex, xor-combine]
