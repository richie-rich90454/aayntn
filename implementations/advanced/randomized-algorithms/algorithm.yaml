algorithm: advanced.randomized-algorithms
title: Randomized algorithms
summary: Make random choices so that no fixed input can force the bad case, then analyze the expected cost and state the failure probability honestly.
subject: advanced
divisions: [gold, platinum]
importance: advanced-technique
prerequisites:
    required: [foundations.sorting, foundations.complexity]
    recommended: [advanced.quickselect, searching.binary-search, foundations.recursion]
complexity:
    time: "O(n log n) expected comparisons, O(n^2) worst case"
    space: "O(n) for the array, O(log n) expected recursion stack, O(n) in the worst case"
assumptions:
    - The array holds n >= 1 signed 32-bit integers and every value fits in the same type in all six languages.
    - The pivot is a uniformly chosen position apart from the negligible modulo bias of the generator.
    - The reference programs use the same xorshift32 generator seeded with 2463534242, so their pivot sequences and comparison counts agree.
    - One comparison is counted for each examination of an element against the pivot during a partition.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n and the array, sorts it with randomized quicksort, and prints the sorted array and the comparison count."
      time: "O(n log n) expected, O(n^2) worst case"
      auxiliarySpace: "O(log n) expected recursion stack, O(n) worst case"
      status: unverified
      inputs: "n, then n signed 32-bit integers, separated by whitespace."
      outputs: "One line with the sorted values separated by single spaces, then one line with the number of pivot comparisons."
      notes: "The generator state is a uint32_t, so every shift wraps at 32 bits without an explicit mask. The array is heap-allocated and freed on every exit path, and the comparison counter is a long long so it cannot overflow at the stated sizes."
      operations: [xorshift32, random-pivot, three-way-partition, quicksort]
