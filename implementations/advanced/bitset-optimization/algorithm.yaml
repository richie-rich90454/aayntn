algorithm: advanced.bitset-optimization
title: Bitset optimization
summary: Store the reachable sums of a subset-sum dynamic program in machine words, so adding one weight shifts the whole set a word of sums at a time.
subject: advanced
divisions: [platinum]
importance: advanced-technique
prerequisites:
    required: [foundations.binary-representation, foundations.complexity]
    recommended:
        [
            dynamic-programming.0-1-knapsack,
            enumeration.subset-enumeration,
            enumeration.meet-in-the-middle,
        ]
complexity:
    time: "O(nW / 32) word operations"
    space: "O(W / 32) words"
assumptions:
    - Every weight is a positive integer, so a partial sum above the limit can never come back down and may be discarded.
    - The limit W is at most 100000 and the number of weights is at most 2000, so the bit vector fits in memory in every language.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n, the limit W and n weights, then prints the number of distinct subset sums at most W."
      time: "O(nW / 32) word operations"
      auxiliarySpace: "O(W / 32) words"
      status: unverified
      inputs: "n, W, then n positive weights, all separated by whitespace, where 1 <= n <= 2000 and 0 <= W <= 100000."
      outputs: "One line with the number of distinct subset sums that are at most W, counting the empty subset as 0."
      notes: "The bit vector is a calloced array of uint32_t words, and each weight shifts the vector left by w with a whole-word offset plus a carry from the word below. The word loop runs downward, so a source word is read before the same weight touches it, and the top word is masked to the bits up to W. The population count uses __builtin_popcount."
      operations: [shift-or, mask, popcount]
