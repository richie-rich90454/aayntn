      notes: "Educational reference implementation: JavaScript is not a USACO submission language. The words are a Uint32Array, every shift result is brought back to 32 bits with >>> 0, and the carry is skipped when the bit offset is zero because JavaScript shifts count modulo 32. The population count is a SWAR routine, and the platform line separator is written so the output matches the compiled languages byte for byte."
      operations: [shift-or, mask, popcount]
