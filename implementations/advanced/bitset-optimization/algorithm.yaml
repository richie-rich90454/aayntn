      outputs: "One line with the number of distinct subset sums that are at most W, counting the empty subset as 0."
      notes: "The variant keeps a list of 32-bit words instead of one large integer, so the word arithmetic is visible rather than hidden in a big-integer shift. Every value written back to a word is masked with 0xFFFFFFFF, and the population count is int.bit_count on each word, which makes the output independent of the word size."
      operations: [shift-or, mask, popcount]
