      notes: "Educational reference implementation: Pascal is not a USACO submission language. The bit vector is a dynamic array of LongWord, and the shift uses Shl and Shr on 32-bit words so it compiles under pas2js. The program uses SysUtils, reads exactly one argument per Read, never touches IOResult, and counts bits with a multiplication-free SWAR routine."
