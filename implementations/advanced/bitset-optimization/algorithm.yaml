      reason: "The canonical program: it reads n, the limit W and n weights, then prints the number of distinct subset sums at most W."
      time: "O(nW / 32) word operations"
      auxiliarySpace: "O(W / 32) words"
      status: unverified
      inputs: "n, W, then n positive weights, all separated by whitespace, where 1 <= n <= 2000 and 0 <= W <= 100000."
      outputs: "One line with the number of distinct subset sums that are at most W, counting the empty subset as 0."
      notes: "The words are int values and the carry uses the unsigned right shift, because the sign bit of a word is an ordinary bit 31 of the sum set. The input is read in one block and parsed by hand, and Integer.bitCount supplies the population count. Shifting by 32 never happens: the carry is skipped when the remainder is zero."
      operations: [shift-or, mask, popcount]
