      outputs: "One line with the number of distinct subset sums that are at most W, counting the empty subset as 0."
      notes: "The bit vector is a std::vector<std::uint32_t>, and the shift is written by hand as a word offset plus a carry, because the point of the listing is the block arithmetic rather than the standard library. The descending word loop gives the 0/1 rule, the top word is masked after every weight, and __builtin_popcount counts the result."
      operations: [shift-or, mask, popcount]
