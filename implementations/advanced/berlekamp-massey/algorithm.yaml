      notes: "Educational reference implementation: JavaScript is not a USACO submission language. The coefficients are BigInt, because a product of two residues near 10^9 is about 10^18 and a Number loses the low bits above 2^53. The modular inverse is a BigInt exponentiation by MODULO - 2n, and the output uses the platform line separator so the six variants agree byte for byte after newline normalization."
