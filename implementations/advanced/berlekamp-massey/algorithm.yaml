      notes: "The current polynomial and the backup are std::vector values, so the snapshot is a vector copy and the swap of the two roles is an assignment. The discrepancy loop is bounded by the order rather than by the allocated size, which keeps the coefficients that the correction wrote beyond the order out of the next dot product. The correction is an index shift by the number of positions since the last order increase."
