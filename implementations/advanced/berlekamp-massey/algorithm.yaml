      notes: "The variant reads the whole input once and splits it, because a per-token read is the slowest part of a Python solution. The coefficients are arbitrary-precision integers, so no product can overflow, and the inverse uses pow(b, MODULO - 2, MODULO). The lists grow with the order, and the slice current[:] is the snapshot that the backup keeps."
