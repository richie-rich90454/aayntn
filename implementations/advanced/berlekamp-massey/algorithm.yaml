algorithm: advanced.berlekamp-massey
title: Berlekamp-Massey
summary: Recover the shortest linear recurrence satisfied by a sequence over a prime field in quadratic time, then extend the sequence from the recurrence instead of from the process that generated it.
subject: advanced
divisions: [platinum]
importance: advanced-technique
prerequisites:
    required: [number-theory.modular-arithmetic, foundations.complexity]
    recommended: [number-theory.matrix-exponentiation, number-theory.fft, advanced.xor-bases]
complexity:
    time: "O(n^2)"
    space: "O(n)"
assumptions:
    - The terms are residues modulo a prime, so every nonzero discrepancy has a modular inverse.
    - The recurrence is linear, homogeneous, and has constant coefficients, and terms before index zero count as zero.
    - The requested order is the shortest one for the supplied prefix, which is unique when at least twice the order is supplied.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads a prefix, prints the order of its shortest recurrence and the next term."
      time: "O(n^2)"
      auxiliarySpace: "O(n) for the three coefficient arrays"
      status: unverified
      inputs: "n, then n residues modulo 1000000007, separated by whitespace."
      outputs: "One line with the order of the shortest recurrence and the next term, separated by one space."
      notes: "The coefficients live in three heap arrays of long long, and the snapshot of the current polynomial is taken before the correction so the backup is always the polynomial that failed. A nonzero discrepancy is repaired with the shifted backup scaled by the ratio of the two discrepancies, and the order grows only when twice the current order is at most the index. Every product is reduced modulo 1000000007, and the modular inverse is computed by fast exponentiation."
      operations: [discrepancy, connection-polynomial-correction, next-term]
