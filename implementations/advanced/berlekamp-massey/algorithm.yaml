      notes: "Educational reference implementation: Pascal is not a USACO submission language. The coefficients are Int64, and every product is computed by splitting one factor at 2^15 so that each intermediate product stays below 2^53 and the program is exact under pas2js as well as Free Pascal. The source uses SysUtils, reads one argument per Read, and avoids IOResult and 128-bit integers. The snapshot is an explicit Copy, so the backup is not affected by the later SetLength and writes on the current polynomial."
