algorithm: advanced.matroids
title: Matroids
summary: Recognize when a family of feasible sets satisfies the exchange property, so the greedy algorithm that takes the heaviest element that keeps the set independent returns a maximum-weight basis.
subject: advanced
divisions: [platinum]
importance: advanced-technique
prerequisites:
    required: [graphs.mst, foundations.sorting]
    recommended: [graphs.dsu, foundations.complexity, greedy.feasibility-oracle]
complexity:
    time: "O(m log m + (n + m) α(n))"
    space: "O(n + m)"
assumptions:
    - The graph is undirected and may be disconnected, so the answer is the weight of a spanning forest rather than of a spanning tree.
    - Every edge weight is a signed integer and the total weight fits in a signed 64-bit integer.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the graph and prints the weight of a maximum-weight spanning forest, computed by Kruskal's greedy rule."
      time: "O(m log m + (n + m) α(n))"
      auxiliarySpace: "O(n + m) for the edge array and the disjoint set union"
      status: unverified
      inputs: "n m, then m lines u v w describing an undirected edge of weight w between vertices 1 and n."
      outputs: "One line with the total weight of a maximum-weight spanning forest."
      notes: "The edge array is sorted with qsort and a comparator that never subtracts the weights, so the comparison cannot overflow. The disjoint set union uses union by size and path halving, and the total is accumulated in a long long, so negative weights and a disconnected graph are handled without special cases."
      operations: [sort-edges, find, union, spanning-forest]
