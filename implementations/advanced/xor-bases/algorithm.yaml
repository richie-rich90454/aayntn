algorithm: advanced.xor-bases
title: XOR bases
summary: Store the subset XORs of a set as an independent basis over the field of two elements, so each query asks for the maximum of a coset with a greedy pass over the bits.
subject: advanced
divisions: [platinum]
importance: advanced-technique
prerequisites:
    required: [foundations.binary-representation]
    recommended: [enumeration.subset-enumeration, range-queries.segment-tree]
complexity:
    time: "O(n log A) to build the basis, O(log A) per query"
    space: "O(log A)"
assumptions:
    - Every input value and every query value is a non-negative integer below 2^30, so 30 bits cover the whole input.
    - The queries are independent, so the basis is built once and never changes while they are answered.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the set and the queries, then prints the maximum XOR of each query with a subset of the set."
      time: "O(n log A) to build the basis, O(log A) per query"
      auxiliarySpace: "O(log A) for the pivot slots"
      status: unverified
      inputs: "n, then n values, then q, then q query values, all separated by whitespace."
      outputs: "One line per query, holding the maximum of x XOR a subset XOR."
      notes: "The basis is an array of 30 unsigned integers, one slot per bit, and each insertion reduces its value against the slots that already own a bit. The query greedy uses an unsigned comparison, so the top bit of a 30-bit value is never mistaken for a sign bit."
      operations: [insert, maximum-xor-query]
