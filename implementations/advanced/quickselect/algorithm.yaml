algorithm: advanced.quickselect
title: Quickselect and randomized selection
summary: Find the k-th smallest element of an array by partitioning around a median-of-three pivot and keeping only the side that holds the rank, which costs linear time in expectation and constant extra space.
subject: advanced
divisions: [silver, gold]
importance: advanced-technique
prerequisites:
    required: [foundations.sorting, foundations.complexity]
    recommended: [searching.binary-search, foundations.recursion]
complexity:
    time: "O(n) expected with a random pivot, O(n^2) worst case"
    space: "O(1) auxiliary in the iterative form, O(n) stack in the worst recursive form"
assumptions:
    - The array holds n >= 1 integers and the rank k satisfies 1 <= k <= n, so the answer always exists.
    - Every value fits in a signed 32-bit integer, so the comparison order is the same in all six languages.
    - The reference programs use the median of the first, middle, and last elements, so they follow the same deterministic sequence of partitions.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the array and the rank, then prints the k-th smallest value with an in-place partition."
      time: "O(n) expected, O(n^2) worst case"
      auxiliarySpace: "O(1) beyond the array"
      status: unverified
      inputs: "n, then n integers, then k with 1 <= k <= n, all separated by whitespace."
      outputs: "One line with the k-th smallest value."
      notes: "The array is heap-allocated so the bound is set by the input rather than by a compile-time constant, and it is freed on every exit path. The pivot is the median of the values at lo, mid, and hi, and the three-way loop moves every copy of the pivot into one block, so duplicates disappear in a single round."
      operations: [median-of-three, three-way-partition, select]
