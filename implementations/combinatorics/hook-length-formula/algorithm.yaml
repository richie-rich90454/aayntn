algorithm: combinatorics.hook-length-formula
title: The hook-length formula
summary: Count the standard Young tableaux of a shape by dividing the factorial of its cell count by the product of the hook lengths of its cells.
subject: combinatorics
divisions: [gold, platinum]
importance: specialized-technique
prerequisites:
    required: [foundations.complexity, combinatorics.binomial-coefficients]
    recommended:
        [
            number-theory.modular-arithmetic,
            combinatorics.integer-partitions,
            combinatorics.multinomial-coefficients,
        ]
complexity:
    time: "O(n + w) for a diagram of n cells and width w, plus O(log M) for the inverse"
    space: "O(k + w) for the row lengths and the column heights"
assumptions:
    - The row lengths are given in non-increasing order, so together they describe a Young diagram.
    - The answer is reported modulo 1000000007, which is prime, and the number of cells is below the modulus, so every hook length is invertible.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the row lengths and prints the number of standard Young tableaux modulo 1000000007."
      time: "O(n + w + log M)"
      auxiliarySpace: "O(k + w) for the row lengths and the column heights"
      status: unverified
      inputs: "One integer k, then k non-increasing row lengths whose sum is n."
      outputs: "One line, holding the number of standard Young tableaux of the shape modulo 1000000007."
      notes: "The column heights are accumulated in one pass over the cells, so every hook length is available in constant time. The factorial is formed modulo the prime, the hook product is formed modulo the prime, and a single Fermat inverse divides them."
      operations: [count-tableaux, compute-column-heights, modular-inverse]
