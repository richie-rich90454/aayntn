algorithm: combinatorics.burnside-lemma
title: Burnside's lemma
summary: Count the necklaces with n beads and k colors up to rotation by averaging the colorings that each rotation leaves fixed, grouping the rotations by gcd, and replacing the division by n with a modular inverse.
subject: combinatorics
divisions: [silver, gold]
importance: common-contest-technique
complexity:
    time: "O(sqrt(n) * (sqrt(n) + log n))"
    space: "O(1)"
assumptions:
    - Two necklaces are equal exactly when one is a rotation of the other, so the group is the cyclic group of order n and reflections are not counted.
    - The bead count satisfies 1 <= n <= 1000000, so n is smaller than the prime modulus and has a modular inverse.
    - A rotation fixes a coloring exactly when the coloring is constant on every cycle of the rotation.
prerequisites:
    required: [number-theory.modular-arithmetic, number-theory.euler-totient]
    recommended: [combinatorics.binomial-coefficients, foundations.complexity]
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n and k and prints the number of k-color necklaces with n beads up to rotation, modulo 1000000007."
      time: "O(sqrt(n) * (sqrt(n) + log n))"
      auxiliarySpace: "O(1)"
      status: unverified
      inputs: "Two integers n and k with 1 <= n <= 1000000 and 1 <= k <= 1000000000."
      outputs: "One line holding the number of necklaces modulo 1000000007."
      notes: "The sum runs over the divisors of n, and the term for a divisor d is phi(d) * k^(n/d). Each divisor is met once by pairing i with n / i while i * i <= n, Euler's totient is computed by trial division, and the division by n is a multiplication by n^(1000000005). The term product is at most 10^6 * (10^9 + 6), so a signed 64-bit integer holds it, and the exponentiation multiplies two residues, whose product is below 2^63."
      operations: [read, divisors, euler-phi, mod-pow, average, print]
