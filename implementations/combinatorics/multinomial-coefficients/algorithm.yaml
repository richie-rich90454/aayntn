      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads one word and prints its number of distinct permutations modulo 1000000007."
      time: "O(n + log p) per word"
      auxiliarySpace: "O(n) for the factorial and inverse factorial tables"
      status: unverified
      inputs: "One word of lowercase letters, read from standard input."
      outputs: "One line with the number of distinct permutations of the word modulo 1000000007."
      notes: "The word is read into a growable buffer so the length is limited by memory rather than by a fixed array, and the two tables are heap-allocated and released on every exit path. The only modular inverse is computed by binary exponentiation."
      operations: [count-frequencies, factorial-table, inverse-factorial-table, multinomial]
