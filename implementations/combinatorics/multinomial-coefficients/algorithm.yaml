algorithm: combinatorics.multinomial-coefficients
title: Multinomial coefficients and the hypergeometric distribution
summary: Count the distinct permutations of a word by dividing n factorial by the factorial of every letter frequency, and evaluate the ratio modulo a prime with one inverse factorial table.
subject: combinatorics
divisions: [silver, gold]
importance: common-contest-technique
prerequisites:
    required: [combinatorics.binomial-coefficients]
    recommended: [foundations.complexity, foundations.recursion]
complexity:
    time: "O(n + log p) per word"
    space: "O(n)"
assumptions:
    - The input is one word of lowercase letters of length n, with n < 1000000007.
    - The modulus is the prime 1000000007, so every factorial that is inverted has an inverse.
    - Two arrangements are equal exactly when they produce the same string, so copies of the same letter are indistinguishable.
reviewed: false
variants:
