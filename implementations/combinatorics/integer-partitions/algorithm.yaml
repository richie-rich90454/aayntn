algorithm: combinatorics.integer-partitions
title: Integer partitions
summary: Count the ways to write n as a sum of positive integers with Euler's recurrence, whose terms sit at the generalized pentagonal numbers and whose sign alternates in pairs.
subject: combinatorics
divisions: [silver, gold]
importance: common-contest-technique
prerequisites:
    required: [foundations.complexity, combinatorics.binomial-coefficients]
    recommended:
        [
            combinatorics.generating-functions,
            number-theory.modular-arithmetic,
            dynamic-programming.0-1-knapsack,
        ]
complexity:
    time: "O(n sqrt n)"
    space: "O(n)"
assumptions:
    - A partition is an unordered multiset of positive parts, so the order of the parts is not counted.
    - The answer is reported modulo 1000000007, so every update is performed in that residue class.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n and prints the number of integer partitions of n modulo 1000000007."
      time: "O(n sqrt n)"
      auxiliarySpace: "O(n) for the partition table of n + 1 entries"
      status: unverified
      inputs: "One integer n, with 0 <= n <= 100000."
      outputs: "One line, holding p(n) modulo 1000000007."
      notes: "The table is a calloc array of n + 1 ints, so the largest stated input needs 400 KB. The offsets and the loop index use long long, because k(3k - 1) is formed before the division and can overflow a 32-bit product on a wider input range."
      operations: [count-partitions, pentagonal-recurrence]
