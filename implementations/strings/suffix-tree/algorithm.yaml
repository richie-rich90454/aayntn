algorithm: strings.suffix-tree
title: Suffix trees
summary: Compress the trie of all suffixes into a tree whose edges are labels, then read the number of distinct substrings from the total edge length and the longest repeated substring from the deepest branching node.
subject: strings
divisions: [gold, platinum]
importance: advanced-technique
complexity:
    time: "O(n^2) for the quadratic construction; O(n) for both answers after the build"
    space: "O(n) nodes with 27 child slots each, for a string of length n"
assumptions:
    - The string has length at most 2000 in the published contract, so inserting every suffix and comparing characters is fast enough.
    - A sentinel character outside the alphabet is appended, so no suffix is a prefix of another and every suffix ends at its own leaf.
    - The alphabet is small and fixed, so a node can carry one child slot per symbol.
    - The number of distinct substrings is accumulated in 64 bits, because it can exceed a 32-bit integer for a longer string.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it builds the suffix tree of the string plus a sentinel and prints the distinct-substring count and the longest repeated substring."
      time: "O(n^2)"
      auxiliarySpace: "O(n) nodes, with 27 child slots per node"
      status: unverified
      inputs: "One line holding a nonempty string of lowercase Latin letters of length at most 2000."
      outputs: "The first line holds the number of distinct nonempty substrings; the second holds the length of the longest repeated substring, or 0 when no substring repeats."
      notes: "Every suffix is inserted by walking down from the root and comparing characters with the edge label. A mismatch inside an edge splits the edge into an internal node with two children. Edge labels are stored as a start position and a length into the string plus its sentinel, so no label is copied. The distinct count is the sum of the edge lengths minus the number of suffixes, and the longest repeat is the greatest depth of a node with at least two children."
      operations: [build, count-distinct-substrings, longest-repeated-substring]
