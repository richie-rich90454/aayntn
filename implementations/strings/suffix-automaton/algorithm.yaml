algorithm: strings.suffix-automaton
title: The suffix automaton
summary: Build the minimal automaton of all substrings in one pass, then read the number of distinct substrings from the class intervals and the occurrence counts from the suffix-link tree.
subject: strings
divisions: [gold, platinum]
importance: advanced-technique
complexity:
    time: "O(26n) for a lowercase alphabet"
    space: "O(26n) for the transition table"
assumptions:
    - The string is fixed before the queries, so the automaton is built once and reused.
    - The alphabet is small and fixed, so a state can carry one transition per symbol.
    - The number of distinct substrings is accumulated in 64 bits, because it can exceed 2^31.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it builds the automaton in one pass and prints the distinct-substring count and the occurrence count of the smallest substring."
      time: "O(26n)"
      auxiliarySpace: "O(26n) for the transition table, plus O(n) for the lengths, links, counts and order"
      status: unverified
      inputs: "One line holding a nonempty string of lowercase Latin letters."
      outputs: "The first line holds the number of distinct nonempty substrings; the second holds the number of occurrences of the lexicographically smallest nonempty substring."
      notes: "The string is read into a growable buffer. The transition table is a flat int array with 26 entries per state, every prefix state is seeded with one, every clone with zero, and the counts are propagated over the suffix-link tree in decreasing length order after a counting sort. The distinct count is a long long."
      operations: [build, count-distinct-substrings, count-occurrences]
