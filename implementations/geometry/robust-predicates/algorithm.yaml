      kind: program
      recommended: recommended
      reason: "The canonical C program: it reads q triples and prints the exact orientation sign of each triple."
      time: "O(1) per query"
      auxiliarySpace: "O(1)"
      status: unverified
      inputs: "q, then q lines with six integers x1 y1 x2 y2 x3 y3."
      outputs: "One line per triple: 1 for a counterclockwise turn, 0 for collinear points, -1 for a clockwise turn."
      notes: "The determinant is formed from the two coordinate differences and compared with zero, so no division and no floating point appears. The coordinates and the products are long long, which holds the largest product and the largest cross product at the stated bound."
      operations: [orientation, sign, collinearity]
