algorithm: geometry.robust-predicates
title: Robust predicates
summary: Read triples of integer points and print the exact orientation sign of each triple, keeping every intermediate value inside a stated integer width.
subject: geometry
divisions: [gold, platinum]
importance: common-contest-technique
prerequisites:
    required: [foundations.binary-representation]
    recommended: [geometry.convex-hull, geometry.integer-geometry]
complexity:
    time: "O(1) per query"
    space: "O(1)"
assumptions:
    - Every coordinate is an integer with absolute value at most 1000000, so every product and every cross product stays below 2^53 and the Pascal variant is exact; the JavaScript variant uses BigInt.
    - A query is a triple of points; duplicate points are allowed and produce the collinear answer.
    - The input holds q triples, one per line.
reviewed: false
variants:
