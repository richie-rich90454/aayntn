algorithm: searching.parametric-search
title: Parametric search
summary: Find the largest level whose capped sum fits a budget by binary searching a monotone predicate over the level, not over the data.
subject: searching
divisions: [gold]
importance: common-contest-technique
prerequisites:
    required: [searching.binary-search, foundations.complexity]
    recommended: [searching.two-pointers]
complexity:
    time: "O(n log U)"
    space: "O(1)"
assumptions:
    - The level is an integer in the closed range from 0 to the largest value.
    - Every value and the budget are nonnegative.
    - The capped sum is nondecreasing in the level, so feasibility is a prefix.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n, n values and a budget, then prints the largest level whose capped sum is within budget."
      time: "O(n log U)"
      auxiliarySpace: "O(n)"
      status: unverified
      inputs: "n, then n nonnegative values, then the budget."
      outputs: "The largest level in [0, max value] with the capped sum at most the budget."
      notes: "The values are held in a heap array of 64-bit integers; under the stated bounds the full sum is at most 2 times 10^14, and the check also stops as soon as the running sum exceeds the budget. The level is clamped at the tallest value, because above it the capped sum no longer changes. n <= 0 prints 0."
      operations: [read-values, evaluate-predicate, discard-left, discard-right]
