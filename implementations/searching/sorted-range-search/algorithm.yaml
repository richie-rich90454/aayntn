algorithm: searching.sorted-range-search
title: Search over a sorted range of indices
summary: Locate the interval that contains a point by halving a sorted array of disjoint intervals, or report that no interval contains it.
subject: searching
divisions: [bronze, silver]
importance: common-contest-technique
complexity:
    time: "O(log n)"
    space: "O(1)"
assumptions:
    - The intervals are sorted by their left endpoint.
    - The intervals are pairwise disjoint, so at most one of them contains a given point.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads a sorted array of disjoint intervals and a point, then prints the index of the containing interval, or -1."
      time: "O(log n)"
      auxiliarySpace: "O(n)"
      status: unverified
      inputs: "n, then n pairs of interval endpoints sorted by left endpoint and pairwise disjoint, then the query point."
      outputs: "The 0-based index of the interval that contains the point, or -1 when no interval contains it."
      notes: "The endpoints are 64-bit integers and both ends of every interval are inclusive. The program holds the intervals in two heap arrays; the search itself needs O(1) extra space. Bad or missing input prints -1."
      operations: [read-intervals, compare-bounds, discard-left, discard-right]
