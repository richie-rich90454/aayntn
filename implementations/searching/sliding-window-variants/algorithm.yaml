algorithm: searching.sliding-window-variants
title: The sliding window variants with a state machine
summary: Run the window as a five-state machine that grows, checks, shrinks, and records, so the longest, shortest, fixed-size, and counting variants differ only in their transition table.
subject: searching
divisions: [silver, gold]
importance: common-contest-technique
prerequisites:
    required: [searching.sliding-window, foundations.complexity]
    recommended: [searching.two-pointers, searching.binary-search]
complexity:
    time: "O(n)"
    space: "O(1) for a fixed byte alphabet, O(sigma) for a hash map"
assumptions:
    - The window predicate is monotone in the direction the selected variant relies on.
    - The alphabet is small enough to index a frequency array, or the implementation uses a hash map.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads a string and k, then prints the length of the longest substring with at most k distinct characters."
      time: "O(n)"
      auxiliarySpace: "O(1)"
      status: unverified
      inputs: "A string s of lowercase English letters, then an integer k."
      outputs: "The length of the longest substring of s with at most k distinct characters."
      notes: "The program buffers the string, so it holds O(n) input characters; the window state is a 256-entry counter array plus one distinct count, which is O(1) auxiliary space. The string is the first whitespace-delimited token and k is the second, so a missing or truncated input prints 0. A negative k is treated as 0."
      operations:
          [read-string, push-right, update-frequency, shrink-left, track-distinct, record-length]
