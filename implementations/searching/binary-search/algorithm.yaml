algorithm: searching.binary-search
title: Binary search
summary: Halve a sorted array until the target is either found or ruled out, which locates one element in logarithmic time.
subject: searching
divisions: [silver, gold]
importance: common-contest-technique
complexity:
    time: "O(log n)"
    space: "O(1)"
assumptions:
    - The array is sorted in non-decreasing order.
reviewed: false
variants:
    - id: minimal
      language: c
      file: c/minimal.c
      kind: minimal
      recommended: recommended
      reason: "Reusable function that returns the 0-based index of the target in a sorted array, or -1 when the target is absent."
      time: "O(log n)"
      auxiliarySpace: "O(1)"
      status: unverified
      inputs: "A sorted array of values and the target value."
      outputs: "The 0-based index of a matching element, or -1 when the target is absent."
      notes: "The array must be sorted in non-decreasing order and the search interval is inclusive on both ends, so an empty array is the only base case. The function allocates nothing and frees nothing: the caller keeps ownership of the array."
      operations: [compute-mid, discard-left, discard-right]
