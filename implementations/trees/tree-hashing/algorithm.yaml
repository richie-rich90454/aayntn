algorithm: trees.tree-hashing
title: Tree hashing
summary: Hash every subtree bottom-up from the sorted hashes of its children, so two rooted trees can be compared in near-linear time regardless of their labels.
subject: trees
divisions: [gold, platinum]
importance: common-contest-technique
prerequisites:
    required: [trees.tree-dp, foundations.complexity]
    recommended: [graphs.dfs, foundations.binary-representation]
complexity:
    time: "O(n log n + m log m)"
    space: "O(n + m)"
assumptions:
    - Each input is a rooted tree given by a parent array, with -1 marking the root and every other parent inside 0..n-1.
    - The comparison is probabilistic; equal hashes are evidence of isomorphism, not a proof.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads two rooted trees as parent arrays and prints whether they are isomorphic as rooted trees."
      time: "O(n log n + m log m)"
      auxiliarySpace: "O(n + m) for the parent arrays, the children lists and the two hash lanes"
      status: unverified
      inputs: "n, then n parents (0-based; -1 marks the root); then m, then m parents with the same convention for the second tree."
      outputs: "SAME when the two rooted trees are isomorphic as rooted trees, DIFFERENT otherwise."
      notes: "The parent array is turned into a compact children list, a breadth-first order is reversed into a postorder, and every vertex sorts the hashes of its children before folding them. Two 32-bit lanes are folded with different bases and different xorshift permutations, so a leaf hashes to the pair (1, 1) and a collision must hit both lanes. The arithmetic is uint32_t, which wraps modulo 2^32 without undefined behavior, and the two components are compared as a pair."
      operations: [build-children, hash-subtree, compare-roots]
