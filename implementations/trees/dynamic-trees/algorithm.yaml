algorithm: trees.dynamic-trees
title: Dynamic trees
summary: Represent a forest as preferred paths stored in splay trees, so that links, cuts, and path aggregates cost amortized logarithmic time.
subject: trees
divisions: [platinum]
importance: advanced-technique
prerequisites:
    required: [trees.lca, foundations.complexity]
    recommended:
        [
            trees.heavy-light-decomposition,
            range-queries.segment-tree,
            foundations.amortized-analysis,
        ]
complexity:
    time: "O(log n) amortized per operation"
    space: "O(n)"
assumptions:
    - The structure is a forest at every step, so every link joins two different trees.
    - The operations arrive online and are links, cuts, or path queries.
    - A path query names two vertices that lie in the same tree.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it maintains a forest under link, cut, and path-sum queries and prints the answer to every path query."
      time: "O(log n) amortized per operation"
      auxiliarySpace: "O(n) for the two children, the parent, the reversal flag, the vertex values, and the splay subtree sums"
      status: unverified
      inputs: "n q, then q lines, each 'link u v', 'cut u v', or 'path u v', with 0-based vertices."
      outputs: "One line per path query, holding the sum of the values on the path, where vertex v carries the value v + 1."
      notes: "Vertices are stored as 1..n and index 0 is the null node. A vertex v carries the value v + 1, so the answer for a path is the sum of the 1-based labels of its vertices. The operations read 'link u v', 'cut u v', and 'path u v'. A link between vertices that are already connected is ignored, and a cut of an edge that does not exist is ignored. The splay operations are iterative, and the explicit stack of push_path holds at most n entries. The output is one line per path query, so the six language versions are byte-identical."
      operations: [link, cut, path-sum]
