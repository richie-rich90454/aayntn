algorithm: trees.lca
title: Lowest common ancestor
summary: A table of the 2^k-th ancestors of every vertex answers the lowest common ancestor of two vertices in logarithmic time.
subject: trees
divisions: [gold, platinum]
importance: common-contest-technique
complexity:
    time: "O((n + m) log n) to build, O(log n) per query"
    space: "O(n log n)"
assumptions:
    - The input is a tree, so there is exactly one path between any two vertices.
reviewed: false
variants:
    - id: minimal
      language: c
      file: c/minimal.c
      kind: minimal
      recommended: recommended
      reason: "Reusable struct with an explicit init/destroy pair that builds the table of the 2^k-th ancestors of a rooted tree and answers the lowest common ancestor and the depth of a vertex; no I/O."
      time: "O((n + m) log n) to build, O(log n) per query"
      auxiliarySpace: "O(n log n) for the ancestor table and the depth array"
      status: unverified
      inputs: "An adjacency list of the tree on the vertices 0..n-1 and the root of the tree."
      outputs: "The lowest common ancestor of two vertices, the depth of a vertex and the ancestor of a vertex that lies 2^k edges above it."
      notes: "up[k * n + v] holds the ancestor of v that lies 2^k edges above it, and the root is its own ancestor, so every entry is defined. A breadth-first walk from the root fills the depths and the parents, and the table of the 2^k ancestors is then built from the table of the 2^(k-1) ancestors. A query lifts the deeper vertex to the depth of the other one and then descends from the largest jump, where the two vertices either stay together or they both move one step below the common ancestor. The C variant owns its storage through an explicit init/destroy pair: init allocates and destroy frees, so every successful init must be matched by exactly one destroy and the table must not be used afterwards. The adjacency list belongs to the caller and is only read while the table is built."
      operations: [build-table, lift, lca]
