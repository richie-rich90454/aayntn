    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it parses a tree from stdin and prints the lowest common ancestor of every queried pair of vertices."
      time: "O((n + m) log n) to build, O(log n) per query"
      auxiliarySpace: "O(n log n) for the ancestor table and the depth array, plus O(n + m) for the adjacency list"
      status: unverified
      inputs: "n m, then m lines u v with 0-based undirected edges, then q, then q lines u v with the queried pair of vertices."
      outputs: "One line per query, holding the index of the lowest common ancestor."
      notes: "The root is the vertex 0 and the answer for a vertex paired with itself is that vertex. An edge that names a vertex outside 0..n-1 is ignored and a query that names such a vertex is answered with -1, and the output is one canonical line per query so the six language versions are byte-identical."
      operations: [build-table, lift, lca]
