algorithm: trees.top-tree
title: The top-tree and rake-compress formulation
summary: Decompose a forest into clusters with at most two boundary vertices, merge them by rake and compress, and expose a path so that one cluster answers the query.
subject: trees
divisions: [platinum]
importance: advanced-technique
prerequisites:
    required: [trees.lca, foundations.complexity]
    recommended:
        [
            trees.heavy-light-decomposition,
            trees.dynamic-trees,
            range-queries.segment-tree,
            foundations.amortized-analysis,
        ]
complexity:
    time: "O(log n) amortized per operation"
    space: "O(n)"
assumptions:
    - The structure is a forest at every step, so every link joins two different trees.
    - The operations arrive online and are links, cuts, vertex updates, and path or subtree queries.
    - A path query names two vertices that lie in the same tree.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it maintains a forest under link, cut, set, and path-sum queries and prints the answer to every path query."
      time: "O(log n) amortized per operation"
      auxiliarySpace: "O(n) for the two children, the parent, the reversal flag, the vertex values, and the splay subtree sums"
      status: unverified
      inputs: "n q, then q lines, each 'link u v', 'cut u v', 'set u x', or 'path u v', with 0-based vertices."
      outputs: "One line per path query, holding the sum of the values on the path. Every vertex starts with the value 1."
      notes: "The six programs maintain the forest with a link-cut tree, not with an explicit top tree: the preferred paths are the compress clusters and the path-parent edges are the rake clusters. The contract is therefore the same dynamic forest, but the code does not build cluster objects. Vertices are stored as 1..n and index 0 is the null node. A link between vertices that are already connected is ignored, and a cut of an edge that does not exist is ignored. A path query between different trees prints 0. Values and sums are 64-bit signed integers, and the output is one line per path query so the six language versions are byte-identical."
      operations: [link, cut, set, path-sum]
