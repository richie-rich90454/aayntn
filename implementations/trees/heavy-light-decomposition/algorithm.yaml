    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it parses a tree from stdin and prints the sum of the values on the path of every queried pair of vertices."
      time: "O(n) to build, O(log n) per path query, because the prefix sums over the flattened array answer a chain segment in constant time"
      auxiliarySpace: "O(n) for the decomposition and the adjacency list"
      status: unverified
      inputs: "n m, then m lines u v with 0-based undirected edges, then q, then q lines u v with the queried pair of vertices."
      outputs: "One line per query, holding the sum of the values of the vertices on the path, both endpoints included."
      notes: "The root is the vertex 0 and the value of the vertex i is i + 1, so the value of the vertex 0 is 1. An edge that names a vertex outside 0..n-1 is ignored and a query that names such a vertex is answered with 0, and the output is one canonical line per query so the six language versions are byte-identical."
      operations: [compute-subtree-sizes, pick-heavy-child, flatten, path-sum]
