algorithm: trees.heavy-light-decomposition
title: Heavy-light decomposition
summary: Split the tree into chains that follow the child with the largest subtree, flatten the chains into one array, and answer a path query in a logarithmic number of chain segments.
subject: trees
divisions: [platinum]
importance: advanced-technique
complexity:
    time: "O(n) to build, O(log^2 n) per path query"
    space: "O(n)"
assumptions:
    - "The tree is static: no node is added, removed or reweighted after the decomposition is built."
reviewed: false
variants:
    - id: minimal
      language: c
      file: c/minimal.c
      kind: minimal
      recommended: recommended
      reason: "Reusable struct with an explicit init/destroy pair that computes the subtree sizes, picks the heavy child of every vertex, flattens the chains into one array and answers a path sum between two vertices; no I/O."
      time: "O(n) to build, O(log n) per path query, because the prefix sums over the flattened array answer a chain segment in constant time"
      auxiliarySpace: "O(n) for the parent, depth, subtree size, heavy child, chain head and position arrays and the flattened array with its prefix sums"
      status: unverified
      inputs: "An adjacency list of the tree on the vertices 0..n-1, the root of the tree and the value of every vertex."
      outputs: "The sum of the values of the vertices on the path from one vertex to the other, both endpoints included."
      notes: "A breadth-first walk from the root fixes the parents and the depths, the subtree sizes are then known from the leaves upwards, and the heavy child of a vertex is the child with the largest subtree. The flattened array holds one chain after the other, so the vertices of a chain occupy a contiguous range of indices. The prefix sums over the flattened array turn a chain segment into a single subtraction, so a query costs one step per chain instead of the O(log^2 n) of a segment tree walk over the same array. The number of chains on a path is logarithmic, because a light edge at least halves the size of the subtree. The C variant owns its storage through an explicit init/destroy pair: init allocates and destroy frees, so every successful init must be matched by exactly one destroy and the decomposition must not be used afterwards. The adjacency list and the values array belong to the caller and are only read while the decomposition is built."
      operations: [compute-subtree-sizes, pick-heavy-child, flatten, path-sum]
