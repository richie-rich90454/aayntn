algorithm: trees.small-to-large-merging
title: Small-to-large merging
summary: Merge the smaller live component into the larger one at every vertex, so each vertex is charged only a logarithmic number of times while every subtree answer is built bottom-up.
subject: trees
divisions: [gold, platinum]
importance: common-contest-technique
prerequisites:
    required: [graphs.dfs, foundations.complexity]
    recommended: [trees.tree-dp, graphs.dsu]
complexity:
    time: "O(n log n) expected"
    space: "O(n)"
assumptions:
    - The input is a rooted tree, and every vertex carries one nonnegative color.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads a rooted tree from stdin and prints the number of distinct colors in the subtree of every vertex."
      time: "O(n log n) expected"
      auxiliarySpace: "O(n) for the live sets, the component weights, the parents and the answers"
      status: unverified
      inputs: "n, then the n colors of the vertices 0..n-1, then the n-1 parents of the vertices 1..n-1, each smaller than its child."
      outputs: "n lines; line v holds the number of distinct colors in the subtree of v."
      notes: "Each vertex starts with a set that holds its own color. The reverse index sweep is a postorder because every parent is numbered before its child, so when a vertex is reached all of its children are already in its set. The set is merged into the parent's set with the larger live component kept as the base, so every scanned color is charged to a vertex whose component at least doubles; the weight is the number of vertices the component represents and is added after each merge. The C variant uses an open-addressing hash set with -1 as the empty marker, so every color is nonnegative; the set owns its slots, and a child's set is released after the merge. The output is one line per vertex so the six languages are byte-identical."
      operations: [merge-sets, answer-subtree]
