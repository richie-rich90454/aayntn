algorithm: enumeration.constraint-propagation
title: Constraint propagation
summary: Carry the effect of every choice in a bitmask domain, so each branch tests all earlier constraints at once and the search visits thousands of nodes instead of millions.
subject: enumeration
divisions: [silver, gold]
importance: common-contest-technique
complexity:
    time: "O(N), where N is the number of visited nodes, which is 856189 for n = 12"
    space: "O(n) for the recursion and O(1) masks per frame"
assumptions:
    - Every constraint is local to the decision that violates it, so its effect on the remaining decisions can be summarized in a fixed-size state.
    - n is at most 12, so the propagated domain fits in one 32-bit word and the counters fit in a 64-bit integer.
    - The node count is the number of recursive calls, including the root and the leaves.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n, counts the n-queens placements with the column and two diagonal masks, and prints the count and the number of visited nodes."
      time: "O(N), where N is the number of visited nodes"
      auxiliarySpace: "O(n) for the recursion and O(1) masks per frame"
      status: unverified
      inputs: "One integer n with 0 <= n <= 12."
      outputs: "One line holding the number of solutions and the number of visited nodes, separated by one space."
      notes: "The program reads n with scanf and keeps the three masks in int, which holds every board up to n = 30; the counters are long long and printed with %lld. The masks are passed by value, so no state is restored on the way back, and the node counter is incremented at the entry of every call, including the root and the leaves."
      operations: [read, propagate, backtrack, count, report]
