algorithm: enumeration.complete-search
title: Complete search
summary: Enumerate every candidate in a finite space, test each one against the statement, and count the successes, with no pruning and no shortcuts.
subject: enumeration
divisions: [bronze, silver]
importance: core-prerequisite
complexity:
    time: "O(2^n) with the include-or-skip recursion, O(n 2^n) with a mask and a rescan"
    space: "O(n) for the recursion stack"
assumptions:
    - The candidate space is finite and every candidate is generated exactly once.
    - The test is decided from the candidate alone, so one test does not hide a search.
    - n is at most 20, so the 2^n candidates are affordable.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n, the values and the target, and counts the subsets whose sum equals the target with a recursive include-or-skip search."
      time: "O(2^n)"
      auxiliarySpace: "O(n) for the recursion stack"
      status: unverified
      inputs: "n, then n integers, then the target T, all whitespace-separated."
      outputs: "One line holding the number of subsets whose sum equals T."
      notes: "The program reads with scanf using %d for n and %lld for the values and the target, stores the values in a static array of twenty long long, and carries the running sum through a recursive include-or-skip search, so every subset is tested once and the empty subset is counted. The counter is long long even though it never exceeds 2^20, because the same code is easy to reuse for a larger candidate space."
      operations: [read, enumerate, include-exclude, test, count]
