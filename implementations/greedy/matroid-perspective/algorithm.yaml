algorithm: greedy.matroid-perspective
title: The matroid perspective
summary: Recognize a matroid from its independence system and exchange property, then sort the items by weight and take every item that keeps the set independent.
subject: greedy
divisions: [gold, platinum]
importance: advanced-technique
prerequisites:
    required: [foundations.sorting, foundations.complexity]
    recommended:
        [greedy.interval-scheduling, greedy.scheduling-deadlines-and-release-times, graphs.mst]
complexity:
    time: "O(n log n)"
    space: "O(n)"
assumptions:
    - The items are partitioned into color classes, and a set is feasible when it contains at most one item of each class.
    - Every weight is a nonnegative integer, and the objective is the total weight of the chosen set.
    - Ties in weight may be broken arbitrarily, because the problem asks only for the total.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n pairs of color and weight, groups the items by color, and prints the maximum total weight of a set with at most one item per color."
      time: "O(n log n)"
      auxiliarySpace: "O(n) for the item array"
      status: unverified
      inputs: "n, then n lines each holding a color and a weight, separated by whitespace."
      outputs: "One line holding the maximum total weight of a set with at most one item per color."
      notes: "The items are sorted by color ascending and by weight descending, so the first item of every color is its heaviest item and the scan adds exactly one weight per color. The comparator returns a three-way result rather than a subtraction, so no difference can overflow, and the total is a long long because the sum can exceed 2^31."
      operations: [sort, scan, sum]
