algorithm: greedy.feasibility-oracle
title: Greedy with a feasibility oracle
summary: Sort the items by weight and take the lightest ones first, using a monotone feasibility test to decide how many of them fit inside a capacity.
subject: greedy
divisions: [silver, gold]
importance: common-contest-technique
prerequisites:
    required: [foundations.sorting, foundations.complexity]
    recommended: [searching.binary-search, arrays.prefix-sums]
complexity:
    time: "O(n log n)"
    space: "O(n)"
assumptions:
    - Every item has a nonnegative weight, every item is worth exactly one unit, and the capacity is a nonnegative integer.
    - Feasibility is monotone in the count, so once k items no longer fit, no larger count can fit either.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n, the capacity and the n weights, sorts the weights, and prints the largest number of weights whose total is at most the capacity."
      time: "O(n log n)"
      auxiliarySpace: "O(n) for the weight array"
      status: unverified
      inputs: "n and the capacity W, then the n weights separated by whitespace."
      outputs: "One line holding the largest number of weights whose total is at most W."
      notes: "The weights are sorted with qsort and a three-way comparator, so no difference can overflow, and the running total is a long long. The scan stops at the first weight that does not fit, because every later weight is at least as heavy."
      operations: [sort, scan, count]
