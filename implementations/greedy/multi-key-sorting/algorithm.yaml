algorithm: greedy.multi-key-sorting
title: Sorting by several keys
summary: Order records by a lexicographic comparison, where the first key decides and later keys only break ties.
subject: greedy
divisions: [bronze, silver]
importance: common-contest-technique
prerequisites:
    required: [foundations.sorting, foundations.complexity]
    recommended: [foundations.recursion]
complexity:
    time: "O(n log n)"
    space: "O(n)"
assumptions:
    - Every record carries the same fixed list of keys, and the required order is lexicographic with a stated direction for each key.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the records, sorts them by a ascending, b descending, c ascending, and prints the sorted records."
      time: "O(n log n)"
      auxiliarySpace: "O(n) for the record array"
      status: unverified
      inputs: "n, then n lines holding the three integers a, b and c of one record."
      outputs: "The n records in sorted order, one record per line with the three fields separated by single spaces."
      notes: "The comparator uses explicit three-way comparisons rather than subtraction, so no difference can overflow, and qsort is given a strict weak ordering because the final branch returns zero only when all three keys agree."
      operations: [sort, compare, print]
