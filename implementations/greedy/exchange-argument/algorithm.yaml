algorithm: greedy.exchange-argument
title: The exchange argument as a general tool
summary: Prove a greedy rule by swapping the greedy choice into an optimal solution without making the solution worse.
subject: greedy
divisions: [silver, gold]
importance: common-contest-technique
prerequisites:
    required: [foundations.sorting, foundations.complexity]
    recommended: [greedy.interval-scheduling, searching.binary-search]
complexity:
    time: "O(n log n)"
    space: "O(n)"
assumptions:
    - The objective is a total order on solutions, so two solutions can be compared as better, equal, or worse.
    - Feasible solutions are closed under taking subsets, and the greedy algorithm stops only when no item can be added.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n intervals and prints the earliest-finish greedy count, the exhaustive optimum for n at most 12, and MATCH or DIFFER."
      time: "O(n log n) for the greedy, O(n^2 2^n) for the oracle"
      auxiliarySpace: "O(n) for the interval arrays"
      status: unverified
      inputs: "n, then n lines each holding a start and an end, with 1 <= n <= 12."
      outputs: 'One line holding "greedy optimum", then one line holding "MATCH" or "DIFFER".'
      notes: "The greedy sorts by end and then by start and scans once. The oracle enumerates every mask and rejects a mask when two selected intervals overlap. The comparator uses comparisons rather than subtraction, so no endpoint difference can overflow, and the free time starts at the smallest 64-bit value divided by four."
      operations: [sort, scan, enumerate, verify]
