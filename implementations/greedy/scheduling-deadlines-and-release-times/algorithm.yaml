algorithm: greedy.scheduling-deadlines-and-release-times
title: Scheduling with deadlines and release times
summary: Maximize the profit of unit-time jobs by keeping the most profitable set that fits before each deadline, and handle release times with an earliest-deadline sweep or a matching.
subject: greedy
divisions: [silver, gold]
importance: common-contest-technique
prerequisites:
    required: [foundations.sorting, foundations.complexity]
    recommended: [range-queries.fenwick-tree, graphs.dsu]
complexity:
    time: "O(n log n)"
    space: "O(n)"
assumptions:
    - Every job takes exactly one unit of time, and every job is available from time 0 unless the statement gives a release time.
    - Deadlines are positive integers, and a job with deadline d must occupy one of the slots 1, 2, ..., d.
    - Profits are nonnegative, so adding a feasible job never lowers the total, and ties may be broken arbitrarily.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n jobs with deadlines and profits, and prints the maximum total profit of the jobs that finish on time."
      time: "O(n log n)"
      auxiliarySpace: "O(n) for the job array and the profit heap"
      status: unverified
      inputs: "n, then n lines holding the deadline and the profit of one job."
      outputs: "A single line holding the maximum total profit."
      notes: "The jobs are sorted by deadline with qsort, and a hand-written binary min-heap keeps the profits of the selected jobs. The heap is trimmed after every insertion, so the prefix condition holds at every step, and the total is accumulated in long long because n profits of 10^9 exceed a 32-bit integer."
      operations: [sort, heap, trim, total]
