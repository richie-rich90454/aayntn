algorithm: graphs.minimum-cost-flow
title: Minimum cost flow
summary: Maximum flow of minimum total cost in a directed network, found by augmenting along shortest paths in the residual graph while potentials keep every reduced cost nonnegative.
subject: graphs
divisions: [platinum]
importance: advanced-technique
prerequisites:
    required: [graphs.dijkstra]
    recommended: [graphs.representation, graphs.bellman-ford]
complexity:
    time: "O(F (V + E) log V)"
    space: "O(V + E)"
assumptions:
    - The network is directed, and every edge has an integer capacity and an integer cost.
    - Every edge cost is nonnegative, so the zero potentials are feasible at the start.
    - Capacities are integral, so every augmentation moves at least one unit and the loop terminates.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads a directed network from standard input and prints the maximum flow and the minimum cost of that flow, using successive shortest paths with potentials."
      time: "O(F (V + E) log V)"
      auxiliarySpace: "O(V + E) for the residual adjacency list, the potentials, the distance array and the heap"
      status: unverified
      inputs: "n m s t, then m lines u v capacity cost with 0-based directed edges, nonnegative capacities and nonnegative costs."
      outputs: "One line with the maximum flow from s to t and the minimum cost of that flow, separated by a space."
      notes: "The residual graph stores each edge together with its reverse, so an augmentation is a cap decrease on the forward arc and a cap increase on the reverse arc. Dijkstra runs on the reduced cost cost + height[u] - height[v], which is nonnegative while the potentials are feasible, and the potentials grow by the final distance of each reachable vertex. An edge with an endpoint outside 0..n-1 or a negative capacity is ignored. Distances and the cost accumulator are 64-bit integers."
      operations:
          [
              read-network,
              initialize-potentials,
              find-shortest-path,
              update-potentials,
              augment-flow,
              accumulate-cost,
              report-result,
          ]
