algorithm: graphs.johnson
title: Johnson's algorithm
summary: All-pairs shortest paths on a sparse directed graph whose weights may be negative, by computing one set of potentials with Bellman-Ford and then running Dijkstra from every vertex on the reweighted graph.
subject: graphs
divisions: [gold]
importance: common-contest-technique
prerequisites:
    required: [graphs.dijkstra, graphs.bellman-ford]
    recommended: [graphs.representation, graphs.floyd-warshall]
complexity:
    time: "O(VE + V(V + E) log V)"
    space: "O(V + E)"
assumptions:
    - Edge weights may be negative.
    - The graph is directed, because an undirected negative edge is already a negative cycle of length two.
    - The graph has no negative cycle, unless detecting one is the goal.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads a directed weighted graph from standard input, computes all-pairs shortest paths with one Bellman-Ford pass and a Dijkstra run from every vertex, and prints the distance matrix or NEGATIVE CYCLE."
      time: "O(VE + V(V + E) log V)"
      auxiliarySpace: "O(V + E) for the adjacency list, the potentials, the distance array and the heap"
      status: unverified
      inputs: "n m, then m lines u v w with 0-based directed edges and integer weights. The input ends after the edges; there is no source vertex."
      outputs: "n lines of n integers: the distance from i to j, and -1 when j is unreachable from i. A graph with a negative cycle prints the single line 'NEGATIVE CYCLE' instead."
      notes: "The potentials start at zero for every vertex, which is the same as joining a virtual source to every vertex with an edge of weight zero. Bellman-Ford relaxes the real edges n times, and a change on the n-th pass proves a negative cycle. Every edge is then reweighted by w + h[u] - h[v], which is nonnegative, and Dijkstra runs from every source with a binary min-heap and lazy deletion. The original distance is recovered by subtracting h[source] and adding h[target]. Distances are 64-bit integers."
      operations:
          [
              initialize-potentials,
              relax-edge,
              detect-negative-cycle,
              reweight-edge,
              push-start,
              extract-min,
              discard-stale,
              recover-distance,
              report-unreachable,
          ]
