      time: "O((V + E) log V)"
      auxiliarySpace: "O(V + E) for the adjacency list, the distance array and the heap of at most O(E) entries"
      status: unverified
      inputs: "n m, then m lines u v w with 0-based undirected edges and nonnegative weights, then the start vertex s."
      outputs: "One line with the distance from s to every vertex, separated by spaces, and -1 for the vertices s cannot reach."
      notes: "The heap is a binary min-heap of (distance, vertex) pairs. A shorter path to a vertex pushes a second entry instead of decreasing the key of the first one, and the stale entry is discarded when it surfaces, so the heap holds at most O(E) entries and the run takes O((V + E) log V) time. An edge that names a vertex outside 0..n-1 or a negative weight is ignored. The output is canonical, which makes the six language versions byte-identical."
      operations:
          [push-start, extract-min, relax-edge, reject-relaxation, discard-stale, complete-vertex]
