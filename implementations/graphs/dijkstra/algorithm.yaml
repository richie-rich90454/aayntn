algorithm: graphs.dijkstra
title: Dijkstra's algorithm
summary: Single-source shortest paths in a graph with nonnegative edge weights, settled in order of increasing distance with a binary min-heap.
subject: graphs
divisions: [gold]
importance: common-contest-technique
complexity:
    time: "O((V + E) log V)"
    space: "O(V + E)"
assumptions:
    - All edge weights are nonnegative.
reviewed: false
variants:
    - id: minimal
      language: c
      file: c/minimal.c
      kind: minimal
      recommended: recommended
      reason: "Reusable function that returns the distance from a source to every vertex of a graph with nonnegative edge weights, using a binary min-heap and -1 for the vertices the source cannot reach."
      time: "O((V + E) log V)"
      auxiliarySpace: "O(V + E) for the distance array and the heap of at most O(E) entries"
      status: unverified
      inputs: "An adjacency list of weighted edges, the number of vertices and the start vertex."
      outputs: "The distance from the source to every vertex, written into the array of the caller, and -1 for the vertices the source cannot reach."
      notes: "The heap is a binary min-heap of (distance, vertex) pairs. A shorter path to a vertex pushes a second entry instead of decreasing the key of the first one, and the stale entry is discarded when it surfaces, so the heap holds at most O(E) entries. The distances are 64-bit integers, because a shortest path may be far longer than a single weight. Ownership: the caller allocates the distance array and the routine only fills it, so it must have room for one entry per vertex."
      operations:
          [push-start, extract-min, relax-edge, reject-relaxation, discard-stale, complete-vertex]
