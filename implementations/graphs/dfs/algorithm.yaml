algorithm: graphs.dfs
title: Depth-first search
summary: Explore every vertex reachable from a start vertex, following each branch to its end before backtracking.
subject: graphs
divisions: [silver, gold]
importance: common-contest-technique
complexity:
    time: "O(V + E)"
    space: "O(V + E)"
assumptions:
    - The graph is undirected.
reviewed: false
variants:
    - id: iterative
      language: c
      file: c/iterative.c
      kind: minimal
      recommended: recommended
      reason: "Avoids call-stack overflow on graphs whose depth can approach V."
      time: "O(V + E)"
      auxiliarySpace: "O(V + E)"
      status: unverified
      inputs: "n m, then m lines u v with 0-based undirected edges, then the start vertex s."
      outputs: "The number of vertices reachable from s, then the reachable vertices in increasing index order."
      notes: "The traversal marks a vertex when it is popped from the stack, so a vertex can be pushed once per incident edge and the stack holds O(V + E) entries rather than O(V). The file exposes the traversal as a reusable function over an adjacency list and then demonstrates it on the standard input."
      operations: [push-neighbour, visit-vertex, complete-vertex, skip-visited]
