    - id: recursive
      language: c
      file: c/recursive.c
      kind: minimal
      recommended: conditional
      reason: "The call stack can grow to the depth of the graph, which overflows in C++ and Java on a long chain."
      time: "O(V + E)"
      auxiliarySpace: "O(V)"
      status: unverified
      inputs: "n m, then m lines u v with 0-based undirected edges, then the start vertex s."
      outputs: "The number of vertices reachable from s, then the reachable vertices in increasing index order."
      notes: "The traversal marks a vertex on entry to the recursive call, so every vertex is entered at most once and the auxiliary space is the visited array plus one stack frame per vertex on the current path: O(V). The file exposes the traversal as a reusable function over an adjacency list and then demonstrates it on the standard input."
      operations: [visit-vertex, complete-vertex]
