algorithm: graphs.floyd-warshall
title: Floyd-Warshall and all-pairs shortest paths
summary: Shortest paths between every ordered pair of vertices, computed by adding one allowed intermediate vertex at a time to a matrix of distances.
subject: graphs
divisions: [silver, gold]
importance: common-contest-technique
prerequisites:
    required: [graphs.representation]
    recommended: [graphs.dijkstra, graphs.bfs, dynamic-programming.dag-dp]
complexity:
    time: "O(V^3)"
    space: "O(V^2)"
assumptions:
    - Edge weights may be negative.
    - The graph has no negative cycle, unless detecting one is the goal.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads a directed weighted graph from standard input, computes all-pairs shortest paths, and prints the distance matrix, with a negative-cycle report when the distances are unbounded."
      time: "O(V^3)"
      auxiliarySpace: "O(V^2) for the distance matrix"
      status: unverified
      inputs: "n m, then m lines u v w with 0-based directed edges and integer weights. The input ends after the edges; there is no source vertex."
      outputs: "n lines of n integers: the distance from i to j, and -1 when j is unreachable from i. A graph with a negative cycle prints the single line 'negative cycle' instead."
      notes: "The matrix is a flat array of 64-bit integers. The diagonal starts at zero, parallel edges keep the cheaper weight, and the outer loop runs over the intermediate vertex. The addition is guarded against the infinity sentinel, so two sentinels are never added. A negative diagonal entry after the loops means the graph has a negative cycle, and the program reports it instead of printing finite distances. The output is canonical, which makes the six language versions byte-identical."
      operations:
          [
              initialize-matrix,
              read-edge,
              relax-through-vertex,
              improve-pair,
              skip-unreachable,
              detect-negative-cycle,
              report-unreachable,
          ]
