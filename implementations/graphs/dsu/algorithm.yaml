algorithm: graphs.dsu
title: Disjoint set union
summary: A structure that keeps a partition of the elements into sets and answers whether two elements share a set, using union by size and path compression.
subject: graphs
divisions: [silver, gold]
importance: common-contest-technique
complexity:
    time: "O((n + q) alpha(n))"
    space: "O(n)"
assumptions:
    - Operations are only unions and membership queries; there is no deletion.
reviewed: false
variants:
    - id: minimal
      language: c
      file: c/minimal.c
      kind: minimal
      recommended: recommended
      reason: "Reusable struct with an explicit init/destroy pair offering find, unite and same over n elements, using union by size and path compression."
      time: "O(alpha(n)) amortised per operation"
      auxiliarySpace: "O(n) for the parent and size arrays"
      status: unverified
      inputs: "A set of n elements, numbered 0..n-1, and the pairs of elements passed to unite and same."
      outputs: "find returns the representative of the set holding an element, and same returns whether two elements share a set."
      notes: "Union by size attaches the root of the smaller set below the root of the larger one, which keeps the trees shallow, and path compression points every element of a path at its root, which flattens them. The two together make every operation take amortised O(alpha(n)) time. Ownership: the structure owns its storage through an explicit init/destroy pair, so init allocates the parent and size arrays and destroy frees them, every successful init must be matched by exactly one destroy, and the structure must not be used after that destroy."
      operations: [find, compress-path, unite, same]
