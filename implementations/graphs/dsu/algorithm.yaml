      status: unverified
      inputs: 'n q, then q operations: "1 u v" merges the sets of u and v and "2 u v" queries whether u and v are in the same set.'
      outputs: "One line per query, holding yes or no."
      notes: "Union by size keeps the trees shallow and path compression flattens them, so the whole run costs O((n + q) alpha(n)) time. An operation that names an element outside 0..n-1 is ignored, and such a membership query answers no. The C variant owns its storage through an explicit init/destroy pair: init allocates the parent and size arrays and destroy frees them, so every successful init must be matched by exactly one destroy. The output is canonical, which makes the six language versions byte-identical."
