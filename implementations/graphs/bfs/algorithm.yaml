algorithm: graphs.bfs
title: Breadth-first search
summary: Explore a graph level by level from a start vertex, which turns the traversal order into shortest-path distances.
subject: graphs
divisions: [silver, gold]
importance: common-contest-technique
complexity:
    time: "O(V + E)"
    space: "O(V + E)"
assumptions:
    - Every edge has unit cost, so the BFS distance is the true shortest-path distance.
reviewed: false
variants:
    - id: minimal
      language: c
      file: c/minimal.c
      kind: minimal
      recommended: recommended
      reason: "Reusable function that returns the distance from a source to every vertex of an unweighted graph."
      time: "O(V + E)"
      auxiliarySpace: "O(V + E)"
      status: unverified
      inputs: "n m, then m lines u v with 0-based undirected edges, then the start vertex s."
      outputs: "The distance from s to every vertex, separated by spaces, and -1 for the vertices s cannot reach."
      notes: "The function has no I/O of its own: it takes an adjacency list and a source and fills a distance array, using -1 for the vertices the source cannot reach. The file adds a driver that reads the standard input format and prints the distances, so the implementation can be run and compared with the program variant."
      operations: [enqueue-start, dequeue, discover-neighbor, complete-vertex]
