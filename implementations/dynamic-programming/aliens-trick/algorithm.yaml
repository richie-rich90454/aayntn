algorithm: dynamic-programming.aliens-trick
title: "The aliens trick"
summary: Split an array into exactly k contiguous groups with minimum total squared group sum by charging a penalty per group and binary searching for the penalty that makes the optimum use k groups.
subject: dynamic-programming
divisions: [platinum]
importance: advanced-technique
prerequisites:
    required: [dynamic-programming.0-1-knapsack, foundations.complexity]
    recommended: [arrays.prefix-sums, dynamic-programming.li-chao-tree, searching.binary-search]
complexity:
    time: "O(n log n log(S_n^2))"
    space: "O(n)"
assumptions:
    - Every array element is a nonnegative integer, so prefix sums never decrease and every cost is an integer.
    - The groups are contiguous and nonempty, and exactly k of them are required.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads n, k and the array from stdin, binary searches the penalty, and prints the minimum total squared group sum."
      time: "O(n log n log(S_n^2))"
      auxiliarySpace: "O(n) for the prefix sums and the Li Chao tree"
      status: unverified
      inputs: "n k, then n nonnegative integers."
      outputs: "The minimum possible sum of squared group sums, on one line."
      notes: "The inner DP is one-dimensional after the penalty is charged, and each transition is a line query evaluated by a Li Chao tree. The tree is a flat array of records allocated for each penalty and released immediately, so the prefix sums are the only long-lived allocation. On equal penalized values the line with more groups wins, which lets the binary search find the largest penalty whose optimum still uses at least k groups. Every cost fits in a signed 64-bit integer under the stated constraints."
      operations:
          [
              read-array,
              prefix-sums,
              binary-search-penalty,
              penalized-dp,
              insert-line,
              query-line,
              subtract-penalty,
          ]
