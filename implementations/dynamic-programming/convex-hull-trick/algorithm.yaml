      outputs: "One line per query, holding the smallest value."
      notes: "The slopes of the lines and the query points both have to be non-decreasing for the amortised cost to hold, and the evaluation of a line uses 64-bit arithmetic, because a product m * x can be far larger than a 32-bit integer. The output is one canonical line per query so the six language versions are byte-identical."
