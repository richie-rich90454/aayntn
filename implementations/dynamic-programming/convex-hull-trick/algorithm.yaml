algorithm: dynamic-programming.convex-hull-trick
title: Convex hull trick
summary: Keep the lower envelope of a set of lines in a stack, so that the smallest value at a point is found in constant amortised time per added line and per query.
subject: dynamic-programming
divisions: [platinum]
importance: advanced-technique
complexity:
    time: "O(n + q) amortised"
    space: "O(n)"
assumptions:
    - Lines are added with non-decreasing slope.
    - Queries arrive with non-decreasing x.
reviewed: false
variants:
    - id: minimal
      language: c
      file: c/minimal.c
      kind: minimal
      recommended: recommended
      reason: "Reusable struct with an explicit init/destroy pair that adds the lines y = m * x + b with a non-decreasing slope and answers the smallest value at a non-decreasing x; no I/O."
      time: "O(n + q) amortised"
      auxiliarySpace: "O(n) for the slope and the intercept of every line on the hull"
      status: unverified
      inputs: "The lines y = m * x + b, added with a non-decreasing slope, and the query points x, which must not decrease."
      outputs: "The smallest value of the lines added so far at every query point."
      notes: "Both monotonicity requirements are what make the cost constant per operation. The hull is a stack of lines with increasing slopes, and the line on top of the stack is the one that is smallest for the smallest x. A new line pops the lines it makes redundant, which are the lines that never hold the minimum because the switch points of the neighbors have to decrease along the stack, and a query walks down the stack as the x grows and drops the line it walks past, because that line has the larger slope and stays the worse of the two for every larger x. Every line is pushed once and popped at most once, so n lines and q queries cost O(n + q). The comparison of the switch points is done on the switch points themselves and not on the products of the coefficients, so the differences of the coefficients have to fit in 64 bits. The C variant owns its storage through an explicit init/destroy pair: init allocates and destroy frees, so every successful init must be matched by exactly one destroy and the hull must not be used afterwards."
      operations: [add-line, query, prune-redundant]
