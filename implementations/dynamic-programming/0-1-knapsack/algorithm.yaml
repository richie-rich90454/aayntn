algorithm: dynamic-programming.0-1-knapsack
title: "0/1 knapsack"
summary: Maximise the total value of a subset of items whose total weight fits in a capacity, with every item usable at most once.
subject: dynamic-programming
divisions: [gold]
importance: common-contest-technique
complexity:
    time: "O(nW)"
    space: "O(W)"
assumptions:
    - Each item may be taken at most once.
reviewed: false
variants:
    - id: minimal
      language: c
      file: c/minimal.c
      kind: minimal
      recommended: recommended
      reason: "Reusable function that fills a caller-provided table with the best value reachable for every capacity at most W and returns the maximum; no I/O."
      time: "O(nW)"
      auxiliarySpace: "O(W) for the table of capacity + 1 entries"
      status: unverified
      inputs: "n items with a weight and a value each, and a capacity W."
      outputs: "The maximum total value of a subset of the items whose total weight is at most W."
      notes: "table[c] holds the best value reachable with total weight at most c, so the answer is table[capacity]. The capacity loop runs downwards so that table[c - weight] still describes the items before the current one; an upwards sweep would read a cell that already contains the current item, which is exactly the unbounded-knapsack mistake. The C variant takes the table as a caller-provided buffer so that the algorithm itself never allocates."
      operations: [init-table, update-row, take-item, skip-item]
