algorithm: dynamic-programming.subset-transforms
title: "Subset transforms"
summary: Sum a function over every subset of every mask, and invert the result, with one pass per bit instead of one enumeration per mask.
subject: dynamic-programming
divisions: [platinum]
importance: advanced-technique
complexity:
    time: "O(n 2^n)"
    space: "O(2^n)"
assumptions:
    - The universe has at most about twenty-four elements, so the table of 2^n masks fits in memory.
    - The values are reduced modulo 1000000007, and every addition stays below twice the modulus.
    - The required quantity is a sum over the subsets or the supersets of each mask, or a subset convolution built from those sums.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "Complete program that reads the 2^n values, applies one zeta pass per bit, and prints the 2^n subset sums."
      time: "O(n 2^n)"
      auxiliarySpace: "O(2^n)"
      status: unverified
      inputs: "n, then the 2^n values f[0] .. f[2^n - 1]."
      outputs: "The 2^n values g[0] .. g[2^n - 1], separated by spaces, on one line."
      notes: "The transform runs in place over a flat array. Each pass walks blocks of 2^(bit + 1) masks and adds the lower half to the upper half. The source half is unchanged during the pass, so no temporary array is needed. Every addition is reduced with one conditional subtraction, because both operands are below the modulus."
      operations: [read-values, zeta-pass, print-values]
