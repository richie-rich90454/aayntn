algorithm: dynamic-programming.li-chao-tree
title: "The Li Chao tree"
summary: Insert lines and answer the smallest value at a point in logarithmic time, with no monotonicity condition on the slopes or on the query coordinates.
subject: dynamic-programming
divisions: [platinum]
importance: advanced-technique
complexity:
    time: "O(q log q) preprocessing and O(log q) per insertion or query"
    space: "O(q) total, O(k) for the tree"
assumptions:
    - Lines are inserted and never deleted.
    - Every query coordinate is known before the tree is built, or the domain of x is a bounded interval.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "Complete program that compresses the query coordinates, builds one Li Chao tree, and replays the insertions and queries from standard input."
      time: "O(q log q) preprocessing and O(log q) per operation"
      auxiliarySpace: "O(q) for the operations, the coordinates, and the tree"
      status: unverified
      inputs: "q, then q lines of either 1 m b or 2 x."
      outputs: "One line per 2 x operation, holding the minimum value at x over every line inserted so far."
      notes: "A line is inserted by comparing it with the line stored at the node, keeping the better line at the midpoint and pushing the loser into the one child where it can still win. A query takes the minimum over every line on the root-to-leaf path. All evaluations use 64-bit integers. The input is read in full first, so the distinct query coordinates can be compressed without changing the order of the operations."
      operations: [collect-coordinates, compress, insert-line, query-min]
