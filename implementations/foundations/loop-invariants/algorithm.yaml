algorithm: foundations.loop-invariants
title: Loop invariants
summary: State what stays true before and after every iteration, then use that statement to prove the loop correct and to choose its boundary conditions; the running example is lower-bound binary search.
subject: foundations
divisions: [bronze, silver]
importance: core-prerequisite
prerequisites:
    required: [foundations.complexity]
    recommended: [foundations.recursion, searching.binary-search]
complexity:
    time: "O(n) to read the array, then O(log n) probes"
    space: "O(n) for the array, O(1) auxiliary"
assumptions:
    - The array is sorted in non-decreasing order.
    - One probe compares one array element with the target and costs one unit.
    - The target and the array values fit in the range of the declared value type.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads a sorted array and a target, runs the lower-bound loop, and prints the index and the probe count."
      time: "O(n) to read the array, then O(log n) probes"
      auxiliarySpace: "O(1) beyond the array"
      status: unverified
      inputs: "n, then n sorted values, then the target."
      outputs: "One line with the lower-bound index in 0..n and the number of probes, separated by a space."
      notes: "The loop keeps the half-open interval [lo, hi) and the invariant that every index below lo is less than the target while every index at or above hi is not. The probe uses a strict comparison, so duplicates of the target settle in the right region and the first occurrence is returned. Values are long long, indices are int, and the midpoint is computed as lo + (hi - lo) / 2 so it cannot overflow."
      operations: [lower-bound, probe-count, binary-search]
