algorithm: foundations.time-memory-tradeoff
title: The time-memory tradeoff
summary: A block-prefix table spends O(n) memory so that every static range-sum query is two lookups, while the smaller table of block totals answers in O(n/B + B) with only O(n/B) memory.
subject: foundations
divisions: [silver, gold]
importance: common-contest-technique
prerequisites:
    required: [foundations.complexity]
    recommended: [arrays.prefix-sums, range-queries.sqrt-decomposition]
complexity:
    time: "O(n) preprocessing and O(1) per query"
    space: "O(n + n/B) = O(n), with B = floor(sqrt n)"
assumptions:
    - The array is static, and each query asks for the sum of an inclusive range.
    - Integer addition is invertible, so a range sum is the difference of two prefix sums.
    - The block size is fixed before the table is built, and the last block may be shorter than the others.
reviewed: false
variants:
