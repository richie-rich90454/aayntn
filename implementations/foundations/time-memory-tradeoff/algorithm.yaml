      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads the scores and the range queries from stdin and prints one sum per query."
      time: "O(n) preprocessing; O(1) per query"
      auxiliarySpace: "O(n + n/B) for the inside prefix and the block prefix; O(n) overall"
      status: unverified
      inputs: "n, then n scores, then q, then q pairs l r."
      outputs: "One line per query, holding the sum a_l + ... + a_r."
      notes: "The scores are read directly into the inside-prefix array and prefixed in place, so the input is overwritten and the table costs n + n/B + 1 entries. The block size is the integer square root of n, and the index formula (i - 1) / B is the block of a 1-based position. The C variant owns both arrays through malloc and frees them before returning."
      operations: [build, prefix, range-sum]
