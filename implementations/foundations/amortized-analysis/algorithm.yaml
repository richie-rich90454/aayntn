algorithm: foundations.amortized-analysis
title: Amortized analysis
summary: A dynamic array that doubles its capacity copies at most a linear number of elements over n pushes, so the total cost is linear even though one push can be expensive.
subject: foundations
divisions: [silver, gold]
importance: core-prerequisite
prerequisites:
    required: [foundations.complexity]
    recommended: [start.algorithm-analysis]
complexity:
    time: "O(n) total for n pushes; O(1) amortized per push"
    space: "O(n) for the array"
assumptions:
    - The sequence starts with an empty dynamic array whose capacity is one.
    - A resize copies every stored element and doubles the capacity before the new element is placed.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reports the total number of copied elements and the final capacity after n pushes."
      time: "O(log n) to sum the resize events"
      auxiliarySpace: "O(1)"
      status: unverified
      inputs: "One nonnegative integer n, the number of pushes."
      outputs: "One line with the total number of copied elements and the final capacity, separated by a space."
      notes: "The copy total is accumulated over resize events, so the array is never materialized. A long long holds both outputs for every input whose final capacity is representable in 64 bits."
      operations: [push, resize, copy-count, capacity]
