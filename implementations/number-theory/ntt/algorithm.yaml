algorithm: number-theory.ntt
title: The number-theoretic transform
summary: Multiply two polynomials in O(n log n) by evaluating them at the powers of a primitive root of unity modulo 998244353, multiplying the values pointwise, and interpolating back.
subject: number-theory
divisions: [platinum]
importance: advanced-technique
prerequisites:
    required: [number-theory.modular-arithmetic, foundations.complexity]
    recommended: [foundations.binary-representation, foundations.recursion]
complexity:
    time: "O(n log n)"
    space: "O(n)"
assumptions:
    - The modulus is the prime 998244353, whose factorization p - 1 = 119 x 2^23 supplies roots of unity for every power of two up to 2^23.
    - The transform length is a power of two at least as large as the number of coefficients in the product.
    - Every coefficient is a residue in [0, p), so a product of two coefficients is below p^2 and fits in a signed 64-bit integer.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads two polynomials and the modulus, pads them to a power of two, runs a radix-2 NTT with the primitive root 3, multiplies pointwise, and prints the product coefficients."
      time: "O(n log n)"
      auxiliarySpace: "O(n)"
      status: unverified
      inputs: "n m p on the first line, then n coefficients of the first polynomial, then m coefficients of the second polynomial, with p = 998244353."
      outputs: "The n + m - 1 coefficients of the product modulo p, separated by spaces on one line."
      notes: "The arrays are allocated to the transform length, and every product of two residues is below 2^60, so a signed 64-bit integer holds it. Both transforms and the inverse transform use the same bit-reversal permutation and radix-2 butterflies."
      operations: [read, pad, transform, pointwise-multiply, inverse-transform, output]
