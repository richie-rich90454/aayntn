algorithm: number-theory.miller-rabin
title: Miller-Rabin primality test
summary: Decide whether a 64-bit integer is prime by writing n - 1 as a power of two times an odd number and checking a fixed set of bases, which is deterministic for the whole signed 64-bit range.
subject: number-theory
divisions: [platinum]
importance: advanced-technique
prerequisites:
    required: [number-theory.modular-arithmetic]
    recommended: [foundations.binary-representation]
complexity:
    time: "O(k log n) modular multiplications with k = 12"
    space: "O(1)"
assumptions:
    - Every value is a non-negative integer below 2^63, where the twelve fixed bases decide every case.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads a count and that many 64-bit integers and prints PRIME or COMPOSITE for each, with deterministic bases and a 128-bit intermediate product."
      time: "O(log n) modular multiplications per base, twelve bases"
      auxiliarySpace: "O(1)"
      status: unverified
      inputs: "t on the first line, then t lines, each holding one non-negative integer below 2^63."
      outputs: "One line per integer, holding PRIME or COMPOSITE."
      notes: "The product of two residues is formed in unsigned __int128 before the modulo, so no 64-bit multiplication can wrap. Small prime factors are removed first, which also handles 2, 3 and every other base, and a value below 2 is reported as composite. The C variant sets the standard output to binary mode so its line feeds match the other five programs."
      operations: [parse, decompose, modular-power, witness-loop, verdict]
