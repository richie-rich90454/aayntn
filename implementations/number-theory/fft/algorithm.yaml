algorithm: number-theory.fft
title: The fast Fourier transform
summary: Multiply two polynomials in O(n log n) by evaluating both at the roots of unity, multiplying the values, and interpolating back with an in-place iterative radix-2 butterfly.
subject: number-theory
divisions: [gold, platinum]
importance: specialized-technique
prerequisites:
    required: [foundations.complexity]
    recommended: [number-theory.modular-arithmetic, foundations.recursion]
complexity:
    time: "O(n log n)"
    space: "O(n)"
assumptions:
    - The two coefficient lists are non-empty and the recovered coefficients are rounded to the nearest integer at the end.
    - The transform length is a power of two at least as large as the degree of the product, so the circular convolution equals the linear one.
    - The coefficients and the transform length are small enough that double-precision rounding error stays below one half.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads two coefficient lists, pads them to a power of two, and prints the rounded coefficients of the product."
      time: "O(n log n) complex operations"
      auxiliarySpace: "O(n)"
      status: unverified
      inputs: "n on the first line, then n coefficients; m on the next line, then m coefficients. Any whitespace separates the integers."
      outputs: "The n + m - 1 coefficients of the product, from degree 0 upward, separated by spaces on one line and rounded to the nearest integer."
      notes: "The real and imaginary parts live in separate calloc'd arrays that are extended and transformed in place. The inverse transform is the forward transform with the opposite angle, followed by a division by n, and the rounding adds 0.5 for a non-negative value and subtracts 0.5 for a negative one before truncating."
      operations: [parse, pad, bit-reversal, butterfly, pointwise-product, inverse, round]
