algorithm: number-theory.discrete-logarithm
title: The discrete logarithm
summary: Find the smallest exponent x with a to the x congruent to b modulo m by meeting in the middle, with a table of baby steps against giant steps of the square root of m.
subject: number-theory
divisions: [gold, platinum]
importance: advanced-technique
prerequisites:
    required: [number-theory.modular-arithmetic]
    recommended:
        - number-theory.extended-euclidean
        - foundations.binary-representation
complexity:
    time: "O(sqrt m) modular multiplications per query"
    space: "O(sqrt m)"
assumptions:
    - The base a and the modulus m are coprime, so every power of a is invertible modulo m.
    - The modulus is at most 2^31 - 1, so the product of two residues fits in a signed 64-bit integer.
    - The exponent is the smallest non-negative solution, and a^0 = 1.
reviewed: false
variants:
    - id: program
      language: c
      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads q triples and prints the smallest exponent for each, with an open-addressing baby-step table and 64-bit modular products."
      time: "O(sqrt m) modular multiplications per query"
      auxiliarySpace: "O(sqrt m)"
      status: unverified
      inputs: "q on the first line, then q lines, each holding a, b and m with 1 <= a < m <= 2147483647 and gcd(a, m) = 1, and 0 <= b < m."
      outputs: "One line per query, holding the smallest non-negative x with a^x = b (mod m), or -1."
      notes: "The baby-step table is keyed by b * a^q and keeps the largest q, so the first giant-step match is the smallest exponent. The hash table is open addressing with linear probing and sizes itself at the smallest power of two that is at least twice the block size. The product of two residues is formed in uint64_t before the modulo, and the standard output is set to binary mode so its line feeds match the other five programs."
      operations: [parse, baby-steps, hash-table, giant-steps, answer]
