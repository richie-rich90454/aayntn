      file: c/program.c
      kind: program
      recommended: recommended
      reason: "The canonical program: it reads a count and that many 64-bit integers and prints the prime factors of each in ascending order, with a deterministic rho and a 128-bit intermediate product."
      time: "expected O(n^{1/4}) rho iterations per semiprime, each O(log n) for the gcd"
      auxiliarySpace: "O(log n) for the stack and the factor list"
      status: unverified
      inputs: "t on the first line, then t lines, each holding one positive integer below 2^63."
      outputs: "One line per integer, holding its prime factors in ascending order separated by single spaces. The factorization of 1 is an empty line."
      notes: "The product of two residues is formed in unsigned __int128 before the modulo, so no 64-bit multiplication can wrap. Small primes up to 37 are removed first, which keeps rho away from the cases where the polynomial has a fixed point. The standard output is set to binary mode so its line feeds match the other five programs."
