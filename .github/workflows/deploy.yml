name: Build and deploy

# The site is a set of static files. The build regenerates every derived
# artifact, renders the pages, and publishes the result to GitHub Pages.
#
# Nothing about the address of the site is written into the sources. This
# workflow works it out from the repository that is running it, so that the
# same files publish correctly as a project site (under the name of the
# repository), as a user site (at the root of the domain), and under a custom
# domain. A repository variable overrides either part:
#
#   AAYNTN_HOSTNAME  the address of the published site, without a trailing
#                    slash; defaults to https://<owner>.github.io
#   AAYNTN_BASE      the path under which the site is published, with a
#                    leading and a trailing slash; defaults to /<repo>/ for a
#                    project site and / for a user site or a custom domain

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        name: Build the static site
        runs-on: ubuntu-latest
        steps:
            # The changelog is read from the history, so the checkout must
            # carry it; a shallow clone would publish a page with one entry.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Work out the address of the site
              id: address
              env:
                  OVERRIDE_HOSTNAME: ${{ vars.AAYNTN_HOSTNAME }}
                  OVERRIDE_BASE: ${{ vars.AAYNTN_BASE }}
              run: |
                  set -euo pipefail
                  owner="${GITHUB_REPOSITORY_OWNER}"
                  repo="${GITHUB_REPOSITORY#*/}"

                  # A user site is published at the root; every other
                  # repository is published under its name.
                  if [ "${repo}" = "${owner}.github.io" ]; then
                    base="/"
                  else
                    base="/${repo}/"
                  fi
                  hostname="https://${owner}.github.io"

                  # A custom domain is published at the root unless the
                  # repository says otherwise.
                  if [ -n "${OVERRIDE_HOSTNAME}" ]; then
                    hostname="${OVERRIDE_HOSTNAME}"
                    if [ "${hostname}" != "https://${owner}.github.io" ]; then
                      base="/"
                    fi
                  fi
                  if [ -n "${OVERRIDE_BASE}" ]; then
                    base="${OVERRIDE_BASE}"
                  fi

                  echo "base=${base}" >> "$GITHUB_OUTPUT"
                  echo "hostname=${hostname}" >> "$GITHUB_OUTPUT"
                  echo "The site is published at ${hostname}${base}"

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install the dependencies
              run: pnpm install --frozen-lockfile

            # The cards read the generated lesson list and are drawn by a
            # browser, so both must exist before they are rendered.
            - name: Generate the derived data
              run: pnpm run generate

            - name: Install the browser that renders the cards
              run: pnpm exec playwright install --with-deps chromium

            - name: Render the share cards
              run: pnpm run og

            - name: Generate, validate and build
              run: pnpm run build
              env:
                  NODE_OPTIONS: --max-old-space-size=3584
                  AAYNTN_BASE: ${{ steps.address.outputs.base }}
                  AAYNTN_HOSTNAME: ${{ steps.address.outputs.hostname }}

            - name: Check that every address of the site carries its base
              env:
                  AAYNTN_BASE: ${{ steps.address.outputs.base }}
              run: pnpm run check:base

            - name: Measure the bundle
              run: |
                  echo "The largest published assets:"
                  find docs/.vitepress/dist/assets -type f -printf '%s %p\n' | sort -rn | head -10 |
                    awk '{ printf "  %8.1f kB  %s\n", $1/1024, $2 }'

            - uses: actions/configure-pages@v6
              with:
                  enablement: true

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/.vitepress/dist

    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
