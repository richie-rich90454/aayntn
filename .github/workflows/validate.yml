name: Validate

# The content checks: schemas, identifiers, the prerequisite graph, the
# internal links and the mathematics. Nothing is built until the content is
# sound, because a broken link in a technical reference is worse than a
# missing page.

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: validate-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    content:
        name: Content and links
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install the dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate the indexes
              run: pnpm run generate

            - name: Check that the generated files are the ones in the repository
              run: |
                  set -euo pipefail
                  if ! git diff --quiet; then
                    echo "The generator wrote something that the repository does not hold:"
                    git diff --stat
                    exit 1
                  fi

            - name: Check the formatting
              run: pnpm run format:check

            - name: Check the types
              run: pnpm exec tsc --noEmit

            - name: Validate the content
              run: pnpm run validate

            - name: Check the internal links
              run: pnpm run check:links

            - name: Run the test suite
              run: pnpm test

            # A site that is published under a path breaks in a way that a
            # local build cannot show, so it is built here the way a project
            # site is published and every address on it is resolved.
            - name: Build the site under a path, as a project site is published
              run: pnpm run build
              env:
                  NODE_OPTIONS: --max-old-space-size=12288
                  AAYNTN_BASE: /aayntn/
                  AAYNTN_HOSTNAME: https://example.github.io

            - name: Check that every address of the site carries its base
              run: pnpm run check:base
              env:
                  AAYNTN_BASE: /aayntn/
