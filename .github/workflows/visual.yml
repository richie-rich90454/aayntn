name: Visual regression

# The design has to survive every width that a reader may bring to it and
# both appearances that a reader may choose. These checks open the pages that
# are most likely to break — a code-heavy article, a long proof, a table, and
# a laboratory — at five widths from a phone to a screen wider than a desk,
# in the light appearance and in the dark one, and measure whether the page
# scrolls sideways, whether anything stands past the edge, whether the text
# keeps its measure, and whether any word has become hard to read.

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: visual-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    layout:
        name: Measure the layout of the reference pages
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install the dependencies
              run: pnpm install --frozen-lockfile

            - name: Build the site
              run: pnpm run build

            - name: Install the browser
              run: pnpm exec playwright install --with-deps chromium

            - name: Measure the pages
              run: pnpm exec playwright test

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: layout-report
                  path: playwright-report/
                  retention-days: 7
